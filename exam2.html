<script type="application/json" id="bankJSON">{"single":[{"n":1,"stem":"下列各組「」內的字，讀音前後相同的是：","body":[],"options":[{"key":"A","text":"兩葉始「櫱」／孤臣「孽」子"},{"key":"B","text":"個性孤「僻」／個人「癖」好"},{"key":"C","text":"通闤帶「闠」／無能昏「聵」"},{"key":"D","text":"通「衢」大道／神情「矍」鑠"}],"answer":"A","explain":"(A)ㄋㄧㄝˋ。(B)ㄆㄧˋ／ㄆㄧˇ。(C)ㄏㄨㄟˋ／ㄎㄨㄟˋ。(D)ㄑㄩˊ／ㄐㄩㄝˊ","source":"習作、課外文選練習題","group":""},{"n":2,"stem":"下列文句，完全沒有錯別字的是：","body":[],"options":[{"key":"A","text":"憚精竭慮、蒿工撐棹"},{"key":"B","text":"不法請托、裨補闕漏"},{"key":"C","text":"擢纓彈冠、調節功能"},{"key":"D","text":"糴米囤糧、恪守本分"}],"answer":"D","explain":"(A)憚→殫、蒿→篙。(B)托→託。(C)擢→濯","source":"習作、大卷","group":""},{"n":3,"stem":"下列文句畫底線的詞語，運用適當的是：","body":[],"options":[{"key":"A","text":"新校舍預定下月完工，師生只需稍候數週，可說是河清難俟，令人期待"},{"key":"B","text":"兩棟教學大樓僅隔一條巷弄，彼此一衣帶水，學生往來十分便利"},{"key":"C","text":"檢調若只查辦基層共犯，卻讓幕後主使逍遙法外，無異縱放吞舟之魚"},{"key":"D","text":"他多次赴京應試，卻接連蟾宮折桂，始終未能金榜題名，只得黯然返鄉"}],"answer":"C","explain":"解析：(A)「河清難俟」比喻等待時間漫長，難以等候，句中僅需再等數週即可完工，使用不當。(B)「一衣帶水」形容兩地僅隔狹窄水域、往來便利，句中兩棟大樓只是隔著巷弄，並無水域相隔，語意不合。(C)「吞舟之魚」比喻犯有大罪或身分重要的罪犯，句中以幕後主使對比基層共犯，使用恰當。(D)「蟾宮折桂」比喻科舉及第，句中卻說接連折桂仍未能金榜題名，正好與成語原意相反","source":"習作","group":""},{"n":4,"stem":"錯綜修辭中以意義相同的詞語，取代形式整齊句子中的某些詞語，稱為「抽換詞面」，例如「君宮中積珍寶，狗馬實外廄，美人充下陳」的「積、實、充」皆是充滿的意思。下列文句同樣使用了「抽換詞面」手法的是：","body":[],"options":[{"key":"A","text":"直如弦、平如砥"},{"key":"B","text":"蓋藏既富，弦誦興焉"},{"key":"C","text":"重以關稅之苛、官吏之酷"},{"key":"D","text":"暑行不汗身、雨行不濡履"}],"answer":"C","explain":"解析：(A)譬喻。(B)弦誦「借代」文教。(C)「苛」、「酷」皆指嚴厲、暴虐。(D)對偶","source":"課文筆記","group":""},{"n":5,"stem":"關於〈鹿港乘桴記〉的寫作手法，下列說明正確的是：","body":[],"options":[{"key":"A","text":"作者未直接明言對統治者的不滿，而是將譏刺藏頭於文章中"},{"key":"B","text":"全文以今昔對比方式鋪寫鹿港在清末與日治之下的經濟狀況"},{"key":"C","text":"作者融情於景，透過描寫鹿港風光與民風依舊，凸顯物是人非的感嘆"},{"key":"D","text":"作者藉由描寫鹿港地區的今昔景象，寄託內心對於現今統治者的期望"}],"answer":"B","explain":"(A)並無藏頭寫法。(C)作者於文中並未提及民風是否純樸依舊。(D)作者對日本統治感到不滿，並未對其寄託任何希望","source":"習作","group":""},{"n":6,"stem":"在篇名〈一桿「稱仔」〉中，作者為「稱仔」一詞加上引號的用意是：","body":[],"options":[{"key":"A","text":"稱揚公權力管轄範圍極廣，連生活用具都含括其中"},{"key":"B","text":"譴責人民未能上行下效，並鑽營法律漏洞"},{"key":"C","text":"反諷執法者不公不義，折毀稱仔形同踐踏法律"},{"key":"D","text":"強調法律之前人人平等，守法須從日常生活細節開始"}],"answer":"C","explain":"解析：(C)「稱仔」為法律規定的度量衡器具，文中稱花並未磨損，卻被代表公權力的巡警折斷，因而以引號表示此器具的意義有所改變","source":"課文筆記","group":""},{"n":7,"stem":"「大人們仍舊伸出手指告誡摸蜆孩童：『拇指、食指大的可以取，其餘的放回河裡。』」關於大人們對待自然資源的態度，可與此相呼應的是：","body":[],"options":[{"key":"A","text":"數罟不入洿池，魚鼈不可勝食也"},{"key":"B","text":"一粥一飯，當思來處不易"},{"key":"C","text":"採菊東籬下，悠然見南山"},{"key":"D","text":"仁者樂山，知者樂水"}],"answer":"A","explain":"解析：(A)主張不用細密漁網捕撈幼魚，使魚類得以持續繁衍，與題幹「只取較大的蜆，其餘放回河裡」同樣具有節制取用、維持自然資源永續的觀念。(B)著重珍惜物力，提醒人們體會資源得來不易。(C)描寫隱居生活中親近自然、悠然自得的心境。(D)以山水說明仁者與智者不同的性情志趣","source":"習作","group":""},{"n":8,"stem":"下文出自洪繻〈鹿港乘桴記〉，請閱讀後選出說明正確的選項：","body":["樓閣萬家，街衢對峙，有亭翼然。亙二、三里，直如弦、平如砥，暑行不汗身、雨行不濡履。一水通津，出海之涘，估帆葉葉，潮汐下上，去來如龍，貨舶相望；而店前可以驅車、店後可以繫榜者，昔之鹿港也。"],"options":[{"key":"A","text":"「直如弦、平如砥」形容鹿港當地建築筆直高聳"},{"key":"B","text":"此段文字呈現鹿港景色的今昔對比"},{"key":"C","text":"「店前可以驅車、店後可以繫榜者」是當時為了農業而設計的建築"},{"key":"D","text":"此段文字記錄鹿港街景與貨運繁榮的模樣"}],"answer":"D","explain":"解析：(A)形容街道如弓弦一樣直，地面像磨刀石一樣平坦。(B)由末句「昔之鹿港也」總結前文，可知該文段僅提及鹿港昔日景色。(C)由前後文中的「估帆」、「貨舶」可以判斷此地商業盛行，應是為了商業上的貨運方便而設計。(D)描寫鹿港不見天街的景色與功能，且道路平坦，上有遮蔭，來往之人不受日曬雨淋之苦，呈現舊時鹿港不見天街車水馬龍、商業興隆的繁華","source":"課本筆記","group":""},{"n":9,"stem":"〈北投硫穴記〉一文描寫作者等人探訪硫穴的過程，請選出錯誤的選項：","body":[],"options":[{"key":"A","text":"由「林木蓊翳」、「林木忽斷」到「草木不生」，可知愈來愈接近硫穴"},{"key":"B","text":"作者先「即穴旁視之」，後「即石上俯瞰之」，可見作者對硫穴很感興趣"},{"key":"C","text":"「轉」東行半里、「渡」兩小溪、「復入」深林等動詞，營造曲折的尋覓過程"},{"key":"D","text":"從「水潺潺巉石間」轉變為「沸珠噴濺」，是因為遭遇地牛翻身"}],"answer":"D","explain":"解析：(D)是因為愈來愈接近硫穴，溫度愈來愈高所致","source":"課外文選練習題","group":""},{"n":10,"stem":"下列關於〈水證據──給河流〉一文結構的敘述，有誤的選項是：","body":[],"options":[{"key":"A","text":"全文先著墨冬山河氾濫時的毀滅性，再描寫平靜時的生機盎然，兩相對比"},{"key":"B","text":"作者在文中化身為「你」，藉由第二人稱視角，使過去的自己與現在的自己進行跨越時空的對話"},{"key":"C","text":"全文善用轉化的修辭手法，賦予河川鮮活的生命力，也使讀者產生強烈的參與感，加強情緒感染力"},{"key":"D","text":"作者善用以大見小的手法，透過書寫全臺灣河流的共同命運，觀照自己幼年時期對冬山河流域的記憶"}],"answer":"D","explain":"(D)作者善用「以小見大」的手法，透過書寫「自己幼年時期對冬山河流域的記憶」，關照「全臺灣河流的共同記憶」","source":"課本筆記","group":""},{"n":11,"stem":"下列文句出自〈鹿港乘桴記〉，描寫鼎盛時期的鹿港者為：","body":[],"options":[{"key":"A","text":"向時估帆所出入者，時已淤為沙灘，為居民鋤作菜圃矣"},{"key":"B","text":"一水通津，出海之涘，估帆葉葉，潮汐下上，去來如龍，貨舶相望"},{"key":"C","text":"去之五里，涸為鹽場，萬瓦如甃、長隄如隍，無懋遷、無利涉"},{"key":"D","text":"是時鹿港通海之水已淺可涉矣，海艟之來，止泊於沖西內津"}],"answer":"B","explain":"解析：(A)寫鹿港港口淤積後，居民將原港口處闢為菜圃，描寫的已非鼎盛時期。(B)說明因鹿港航道暢通，直達海邊，故商船密集壯觀，為彰化八景「鹿港飛帆」的景象。(C)寫鹿港港口改為鹽場，已無貿易往來的情景，並非鼎盛時期的鹿港。(D)寫大船無法入港，只能停泊於海上，故知已非鼎盛時期的鹿港","source":"課本筆記","group":""},{"n":12,"stem":"請選出〈一桿「稱仔」〉中能與引文情況呼應的文句：","body":["他們平日吃飽了豐美的飯食，若是無事可做，於衛生上有些不宜，生活上也有些乏味，所以不是把有用的生產能力，消耗於遊戲運動中，便是去找尋—可以說去製造一般人類的犯罪事實，這樣便可以消遣無聊的歲月，並且可以做盡忠於職務的證據。（賴和〈蛇先生〉）"],"options":[{"key":"A","text":"因為巡警們，專在搜索小民的細故，來做他們的成績，犯罪的事件，發見得多，他們的高昇就快"},{"key":"B","text":"她剛跨進郡衙的門限，被一巡警的「要做什麼」的一聲呼喝，已嚇得倒退到門外去"},{"key":"C","text":"「不，稱稱看！」巡警幾番推辭著說。誠實的參，亦就掛上稱仔稱一稱"},{"key":"D","text":"「但是，巡警的報告，總沒有錯啊！」法官"}],"answer":"A","explain":"解析：(A)與題幹皆指警察刻意尋找或捏造百姓違法的證據，以達到自利的目的。(B)寫出小老百姓對日本警察的害怕。(C)巡警想白拿生菜，卻故作客氣，而得參也未參透其本意。(D)顯示官員之間官官相護","source":"課本筆記","group":""},{"n":13,"stem":"關於下列詩作的解讀，最適當的是：","body":["甲","我喜歡躺在早春微涼的胸膛／──最好是18度C的冷感／張開熱切的想望／大地的心跳令我羞赧／於是，緋紅著臉低著頭／在枝椏上相互簇擁／磨蹭出足夠的勇氣／聆聽如波浪洶湧而來／綻放的聲音。（路寒袖〈臺灣的春天─詩詠山櫻花〉）","乙","你單層的花瓣展現單純的美／不像玫瑰層層裹藏著秘密／五片心形的花瓣束在一起／你集中意志抵擋日落後的嚴寒／平地的薔薇依靠著牆叢生／高山薔薇啊／你在嶺上蔓爬／以你的純白與夜黑對峙／以你縷縷的細香襲入大氣。（鍾玲〈高山薔薇〉）"],"options":[{"key":"A","text":"甲詩「躺在早春微涼的胸膛」可看出山櫻花多半開在山腰以上的位置"},{"key":"B","text":"甲詩「緋紅著臉低著頭」描述櫻花樹間隔過於擁擠，花團錦簇的盛況"},{"key":"C","text":"乙詩「平地的薔薇依靠著牆叢生」藉平地薔薇反襯高山薔薇獨立自主"},{"key":"D","text":"乙詩「以你的純白與夜黑對峙」指高山薔薇在黑夜綻放，白天就凋謝"}],"answer":"C","explain":"解析：(A)可看出山櫻花多在初春時節開花。(B)描述山櫻花朵外型呈下垂狀。( D)指純白的高山薔薇在黑夜綻放","source":"我讀至升級第五回","group":""},{"n":14,"stem":"關於下文的解讀，選項中的分析何者正確？","body":["等巡警去遠了，才有幾個閒人，近他身邊來。一個較有年紀的說：","「該死的東西，到市上來，只這規紀亦就不懂？要做什麼生意？汝說幾斤幾兩，難道他的錢汝敢拿嗎？」","「難道我們的東西，該白送給他的嗎？」參不平地回答。","「唉！汝不曉得他的厲害，汝還未嘗到他，青草膏的滋味。」那有年紀的嘲笑地說。","「什麼？做官的就可任意凌辱人民嗎？」參說。","「硬漢！」有人說。眾人議論一回、批評一回，亦就散去。"],"options":[{"key":"A","text":"此處多以「臉部表情的描摹」來敘寫人物形象"},{"key":"B","text":"「青草膏」是貼在酸痛處的膏藥，此處借代「拷打」"},{"key":"C","text":"秦得參以感嘆語氣表達對日警的不滿"},{"key":"D","text":"作者安排閒人的話語，旨在讚揚社會大眾暗中支持秦得參的反抗"}],"answer":"B","explain":"解析：(A) 此處未有臉部表情的描摹。(B) 秦得參是用「憤慨、不平」的語氣質問。(D)暗示社會大眾對不公不義採取消極妥協的態度","source":"課堂學習單","group":""},{"n":15,"stem":"下列關於蘇軾〈烏說〉的解說，最不適當的是：","body":["烏於人最黠，伺人音色有異，輒去不留，雖捷矢巧彈，不能得其便也。閩中民狃（了解）烏性，以謂物無不可以性取者，則之野，挈罌飯、楮錢，陽哭冢間，若祭者然。哭竟，裂錢棄飯而去。烏則爭下啄，啄盡；哭者復立他冢，裂錢棄飯如初。烏不疑其紿也，益鳴爭，乃至三四，皆飛從之。稍狎，迫於羅，因舉獲其烏焉。今夫世之人，自謂智足以周身，而不知禍藏於所伏者，幾何不見賣於哭者哉！（蘇軾〈烏說〉）"],"options":[{"key":"A","text":"「音色有異」指人們聲音和表情不同於往常"},{"key":"B","text":"「裂錢棄飯」指人們怕遭攻擊而丟下錢和飯"},{"key":"C","text":"「不疑其紿」指烏鴉不懷疑人們的欺騙手法"},{"key":"D","text":"「舉獲其烏」指烏鴉全部都被人們網羅捕捉"}],"answer":"B","explain":"解析：(B)「裂錢棄飯」指人們為了欺騙烏鴉而刻意撒下紙錢、把飯留下，並非害怕遭烏鴉攻擊。語譯：烏鴉是十分狡猾的鳥類，一旦察覺人類的神情異於平常，就會飛走不作停留，即使用飛快的箭和靈活的彈弓，也沒有捕獲牠們的機會。閩中的百姓了解烏鴉的習性，認為沒有動物不能反過來利用其習性去捕捉的，便前往野外，拿著盛著飯的瓦罐和紙錢，到墳間假裝哭泣，就好像來祭拜的人一樣。哭完以後，他們撒下紙錢、把飯留下就離開了。烏鴉見狀就爭相飛來啄食，沒多久就吃完了；哭泣的人又站在另一處墳前，像剛才一樣撒下紙錢、把飯留下就離開。烏鴉沒有懷疑這是人類的欺騙手法，更起勁鳴叫著搶食，於是這樣重複到三、四次後，所有的烏鴉都飛下來跟著人了。當烏鴉越來越親近他們，接近設好的捕網時，人們趁機捕獲了這些烏鴉。如今的世人，自認憑自己的智慧足以保全自身，卻不知道災禍隱藏在一旁，又有幾個人能夠不被這樣的哭號者出賣呢！","source":"我讀至升級第四回","group":""},{"n":16,"stem":"關於甲、乙二詩的敘寫方式，最適當的是：","body":[],"options":[{"key":"A","text":"甲詩結合神話傳說，塑造出優美的人間仙境"},{"key":"B","text":"乙詩採對比手法，比擬沸泉與硫氣侵蝕之景"},{"key":"C","text":"二詩皆透過感官摹寫，描繪接觸硫穴的見聞"},{"key":"D","text":"二詩皆以俯瞰視角，聚焦描敘沸泉蒸騰之景"}],"answer":"C","explain":"解析：(A)甲詩結尾描寫北投此地白氣縷縷的景色，如同煮著白石以迎接神仙的到來，並非結合神話傳說以塑造人間仙境。(B)乙詩具體說明泉水沸騰讓人行走困難，以及硫氣薰染下的岩石，並非對比手法。(D)二詩的空間視角變化不一，且多為遠景描繪。","source":"","group":"16–17 題組"},{"n":17,"stem":"下列最能呼應乙詩情景的敘述是：","body":[],"options":[{"key":"A","text":"左右兩山多巨石，為硫氣所觸，剝蝕如粉"},{"key":"B","text":"又陟一小山顛，覺履底漸熱，視草色萎黃無生意"},{"key":"C","text":"還就深林小憩，循舊路返。衣染硫氣，累日不散"},{"key":"D","text":"望前山半麓，白氣縷縷，如山雲乍吐，搖曳青嶂間"}],"answer":"A","explain":"解析：選項皆\n【語譯】（甲）大自然所有的奇景都匯聚於此地，在高聳的山嶺之間，竟然湧出沸騰的泉水。在泉水湧出處，還從地底傳來如雷的轟然巨響，而冒出一陣陣的毒霧籠罩整個山崖。泉水流成深藍色的小溪，兩旁本該四季長青的松樹呈現出枯槁的姿態，原該碧綠的草坡，被染成紅通通的一片，就像快燃燒起來一般。此地遠遠望去就像神仙所居的蓬萊與瀛洲一樣，正煮著山石，似乎準備迎接神仙的降臨。\n（乙）在今年的五月，我帶著少數的隨從，來到海外的這處火山。怎麼會想到在溫泉冒出的此地，竟如此舉步維艱。高聳的石頭在硫氣的蒸薰下，竟然剝落呈粉末狀，硫磺的結晶竟然形成如篆書一般的線條。轟然的聲響可以傳到十里之外，而這並不是溪水流動的聲音，竟是溫泉口發出的轟然巨響。","source":"〈北投硫穴記〉【選項語譯】請參看課外閱讀文選L4。","group":"16–17 題組"},{"n":18,"stem":"依據上文，關於賴和對「現代化」的態度，敘述最適當的是：","body":[],"options":[{"key":"A","text":"接受且樂見臺灣現代化的過程"},{"key":"B","text":"希望臺灣由外部來推動現代化"},{"key":"C","text":"基於反對殖民統治，亦反對現代化"},{"key":"D","text":"期望臺灣現代化又擔心受制於異族"}],"answer":"D","explain":"解析：(A)由「他更清楚現代化對臺灣社會也具有雙刃性的作用」可知，並非毫無疑慮地樂見其成　(B)由「現代化並非是從臺灣社會內部自發性產生，而是由日本人以強制性手法加諸臺灣人身上」可知，作者僅陳述臺灣在現代化過程中遭遇的事實狀況，並沒有「希望」由外部來推動　(C)由「現代化是無可抵擋的。臺灣社會若不進行文化改造，則永無翻身之地」可知，認為現代化有其必要　(D)由「他更清楚現代化對臺灣社會也具有雙刃性的作用。臺灣若不追求現代化，就必須接受被支配的命運」可知，既擔心又認為有其必要","source":"課外延伸","group":"18–19 題組"},{"n":19,"stem":"依據上文，下列關於賴和創作時代背景的評論，○○、☆☆、□□最可能是：","body":["「○○」、「☆☆」、「□□」已形成一種鞏固統治秩序的三角關係，☆☆是○○制訂來維持社會秩序的，□□為○○執行☆☆，○○的則權威具現在□□的權力之上，為了統治秩序的確立，□□的權威也被「上綱」到無可懷疑的地步，這就是近代資產階級統治的特點。……現代國家的法律具有的統治階級性格，是賴和所看到的殖民地異象，在這裡「法律」已失去正義、公平的價值，而對臺灣多數的下層民眾帶來無數的災難。（陳建忠《賴和讀本》）"],"options":[{"key":"A","text":"○○：國家 / ☆☆：法律 / □□：警察"},{"key":"B","text":"○○：國家 / ☆☆：警察 / □□：法律"},{"key":"C","text":"○○：統治者 / ☆☆：警察 / □□：資本家"},{"key":"D","text":"○○：資本家 / ☆☆：法律 / □□：統治者"}],"answer":"A","explain":"解析：由「賴和就批判法律的失衡。所謂正義，只是向官方片面傾斜」可知，法律失去正義的價值，符合題幹的敘述，故☆☆為法律。而警察為法律的執行者，故□□為警察。這三者服務的對象是「官方」，故○○宜填入國家或統治者","source":"課外延伸","group":"18–19 題組","table":"<div class=\"table-scroll\"><table><tr><th>項目<\/th><th>○○<\/th><th>☆☆<\/th><th>□□<\/th><\/tr><tr><td>(A)<\/td><td>國家<\/td><td>法律<\/td><td>警察<\/td><\/tr><tr><td>(B)<\/td><td>國家<\/td><td>警察<\/td><td>法律<\/td><\/tr><tr><td>(C)<\/td><td>統治者<\/td><td>警察<\/td><td>資本家<\/td><\/tr><tr><td>(D)<\/td><td>資本家<\/td><td>法律<\/td><td>統治者<\/td><\/tr><\/table><\/div>"},{"n":20,"stem":"關於上文對清末臺灣攻守情勢的分析，敘述最適當的是：","body":[],"options":[{"key":"A","text":"基於後勤準備已充足而可誘敵深入"},{"key":"B","text":"由海戰與陸戰兩方面揭示敵我利弊"},{"key":"C","text":"因船艦操作耗人力而主張放棄海戰"},{"key":"D","text":"從軍民齊心的優勢判斷可無懼陸戰"}],"answer":"B","explain":"解析：(A)文中僅指出引誘敵方登岸作戰更有利於我方，並無提及後勤準備充足可誘敵深入等論述。(C)文中僅指出海戰的不利之處，並未主張放棄海戰。(D)文中並無軍民齊心的相關論述，而是點出若敵方登陸，可能造成民心軍心的動搖\n語譯：我方確實有勇猛的戰士，有善謀略的將軍，心裡有戰勝的把握，也有可以依靠的地理優勢，卻仍然比不上將敵人引誘上岸，再設埋伏來殲滅他們的戰法。否則，在寬廣的大海上指揮數百人操縱船艦，到處奔波突擊，打著無法確知是否能勝利的仗，縱使我軍未有折損，敵方受到的威脅小，我軍卻勞師動眾，還須顧及防衛之事，情勢上不也是讓人備感鬱悶嗎！不過引誘敵人上岸，若沒有十足把握，那是決不可行的。因為敵人一旦登陸，民心容易浮動，軍心容易震盪，除了歷戰老道的士兵之外，無人能順利應付。我生長於臺灣，為臺灣（的現況）考量，臺北港可以引誘敵軍上岸，臺南港則不可行。由於臺北港的船道水深且有遮掩，他們要停船相當便利；但上岸之後，反而失去這項優勢。臺南港的港口雖然淺，風浪極強，周圍又沒有山，港內並不適合停船；他們不上岸，便不能久待。至於臺中的各個港口，屬於較淺的沙岸，難以行駛鐵船。一旦澎湖失守，那麼敵人就能進占澎湖，順利接收島上港口。有時乘大船四處掠奪搜括，有時開小艇窺探擅闖，臺中難以抵禦，那麼臺南、臺北也將令人擔憂。","source":"112年學測","group":"20–21 題組"},{"n":21,"stem":"關於①、②是否符合上文看法，最適當的研判是：","body":["①應加強澎湖海防，避免敵軍入侵臺北、臺中、臺南三地。","②依臺北、臺南地形評估，引誘敵軍自臺北登岸，是可行的戰略。"],"options":[{"key":"A","text":"①、②皆符合"},{"key":"B","text":"①符合，②不符合"},{"key":"C","text":"①符合，②無法判斷"},{"key":"D","text":"①無法判斷，②符合"}],"answer":"A","explain":"解析：由「然澎湖不守，則敵人得之，安穩收泊。有時展輪四掠，有時載小艇窺闖，臺中難防，臺南、北亦可慮」可知，澎湖的海防影響臺北、臺中、臺南，描述符合文中看法。由「為臺灣計，臺北可誘之近岸，臺南則不可」可知，描述符合文中看法。綜合上述，故選(A)","source":"112年學測","group":"20–21 題組"},{"n":22,"stem":"關於甲文巡警、乙文查大人的逞威尋釁，下列敘述何者正確？","body":[],"options":[{"key":"A","text":"巡警因秦得參對斤兩錙銖必較而不滿"},{"key":"B","text":"巡警捏造毀損公物之罪而嚴懲秦得參"},{"key":"C","text":"查大人因兒童隱瞞事實而怒摑他巴掌"},{"key":"D","text":"查大人為立官威而須讓兒童接受訊問"}],"answer":"D","explain":"解析：(A)秦得參未看出巡警想白拿的心態，故僅少算二兩的錢，使巡警因秦得參的不識相而惱羞成怒。(B)巡警僅記下秦得參的姓名和住址，並未當場懲處或捏造參毀損公物。(C)查大人認為哭泣是軟弱無用的表現，故對兒童心生厭惡而掌摑，並非是因為兒童隱瞞事實。(D)由「在查大人的思想，官事一點也不容許人民過問，他本無為難這兒童的意志。但到現在就不能隨便了事，怕被世間誤解，以為受到抗議才釋放他。這很關礙做官的尊嚴」可知，查大人原本並未打算為難兒童，但因旁人出聲干預，擔心自己權威受損，才認為不能隨便釋放兒童，必須透過正式訊問來維護官威與尊嚴","source":"114年統測","group":"22–25 題組"},{"n":23,"stem":"依據下框所示的諷刺手法常見特徵，下列乙文中作者使用的兩項諷刺，最可能含有何種特徵？","body":["Ⅰ、（查大人）輕輕地打他一掌說：……那兒童立刻止住哭聲，偷偷地用手來摩擦著印有指痕紅腫的嘴巴。","Ⅱ、做官的不會錯，現在已經成爲定理。"],"options":[{"key":"A","text":"Ⅰ：② ／ Ⅱ：①③"},{"key":"B","text":"Ⅰ：③ ／ Ⅱ：②④"},{"key":"C","text":"Ⅰ：①② ／ Ⅱ：④"},{"key":"D","text":"Ⅰ：③④ ／ Ⅱ：①"}],"answer":"A","explain":"解析：(A)Ⅰ表面上是「輕輕地」打他一巴掌，但實際結果卻讓兒童嘴巴「紅腫、有指痕」，「輕輕地」應該不會造成「紅腫」，兩者前後敘述不一致，此為語中有互斥的訊息，屬於特徵②。Ⅱ在正常邏輯下，做官的也可能會犯錯，因此「做官的不會錯」，明顯違反常理，此為故意說偏離的反話，屬於特徵①。「做官的不會錯，現在已成為定理」表面上是在稱讚官員不會錯，實際上是在挖苦官場的專橫與不公，此為語中稱頌裡含機誚，屬於特徵③","source":"114年統測","group":"22–25 題組","table":"<div class=\"table-scroll\"><table><tr><th>諷刺手法常見特徵<\/th><th>諷刺手法常見特徵<\/th><\/tr><tr><td>特徵<\/td><td>例句<\/td><\/tr><tr><td>①故意說偏離常理的反話<\/td><td>「他真是料事如神啊！」（事實是猜測錯誤）<\/td><\/tr><tr><td>②話中有互斥的訊息<\/td><td>「他真是料事如神，沒一件說中！」<\/td><\/tr><tr><td>③話中稱頌裡含譏誚<\/td><td>「他真是料事如神──不，是比神還要神！」<\/td><\/tr><tr><td>④話中有虛偽的對比<\/td><td>「我那麼笨，哪比得上他料事如神！」<\/td><\/tr><\/table><\/div><div class=\"table-scroll\"><table><tr><th><\/th><th>Ⅰ<\/th><th>Ⅱ<\/th><\/tr><tr><td>(A)<\/td><td>②<\/td><td>①③<\/td><\/tr><tr><td>(B)<\/td><td>③<\/td><td>②④<\/td><\/tr><tr><td>(C)<\/td><td>①②<\/td><td>④<\/td><\/tr><tr><td>(D)<\/td><td>③④<\/td><td>①<\/td><\/tr><\/table><\/div>"},{"n":24,"stem":"甲、乙文畫底線處的解釋，何者最適當？","body":[],"options":[{"key":"A","text":"①意謂秦得參對於自售的貨品頗有信心"},{"key":"B","text":"②意謂巡警故意設圈套誘使秦得參犯罪"},{"key":"C","text":"③意謂查大人視啼哭為諷刺他執法無能"},{"key":"D","text":"④意謂民眾介入反令查大人懲罰無辜者"}],"answer":"D","explain":"解析：(A)①應是秦得參感謝巡警光顧，因此打算獻菜。(B)②應是巡警作作樣子的門面話，他其實是想白拿。(C)③查大人未有此意。查大人認為啼哭是弱者用來表達無助的方式。(D)由「但到現在就不能隨便了事，怕被世間誤解，以為受到抗議才釋放他。這很關礙做官的尊嚴」可推知","source":"114年統測","group":"22–25 題組"},{"n":25,"stem":"關於甲、乙文敘寫手法的說明，何者最適當？","body":[],"options":[{"key":"A","text":"二文皆透過街上路人的視角，以客觀而冷靜的口吻描述事件經過"},{"key":"B","text":"甲文側重記述巡警的外在言行與情緒轉變，乙文另揭示查大人的內在想法"},{"key":"C","text":"甲文「誠實的參」來自巡警的感受，乙文「不幸這個兒童」來自查大人的感受"},{"key":"D","text":"二文「不去嗎」、「不說嗎」皆既凸顯施暴者的蠻橫，又洩露其受群眾威脅的不安"}],"answer":"B","explain":"解析：(A)二文皆是以第三人稱視角描述事件，並非以路人視角描述。(B)甲文由敘述刑警因秦得參未能參透其欲白拿的心態而臉色丕變，進而赫怒並打斷秤仔，氣憤返回警署可知。乙文由末段敘述查大人無法接受自身權威被質疑，而將兒童送進衙門審問可知。(C)甲文「誠實的參」、乙文「不幸這個兒童」皆來自作者的感受。(D)甲文「不去嗎」、乙文「不說嗎」皆凸顯施暴者的蠻橫，但沒有受群眾威脅的不安感受","source":"114年統測","group":"22–25 題組"}],"multiple":[{"n":26,"stem":"下列「」中的字義，前後相同的選項是：","body":[],"options":[{"key":"A","text":"「去」來如龍，貨舶相望／「去」國懷鄉，憂讒畏譏"},{"key":"B","text":"余攬衣「即」穴旁視之／望之儼然，「即」之也溫"},{"key":"C","text":"海天「蒼蒼」／視茫茫，而髮「蒼蒼」"},{"key":"D","text":"今裁三千家而已，可「勝」慨哉／不「勝」其擾"},{"key":"E","text":"「向」新溝迤邐而行／「向」時估帆所出入者"}],"answer":"A、B","explain":"解析：(A)離開。(B)靠近。(C)深青色／斑白的樣子。(D)盡／承受。(E)朝著／先前","source":"習作、課外文選練習題","group":""},{"n":27,"stem":"下文畫線的①至⑤五處敘述中，正確的選項是：","body":["史家組織歷史材料的方法，就是「史書體例」。","最早常見的是依年月先後記事的編年體，《左傳》、《資治通鑑》都是代表，而它的①好處是能把一件事的起因、經過與結果一次寫完，讀者不必翻找各處。相對的，②《國語》、《戰國策》依國家分卷，各記其國之事，屬於國別體；若想了解同一時期各國如何互動，就得在不同卷之間來回對照。","到了司馬遷，《史記》以人物為中心，奠定了紀傳體的基本格局。其中本紀通常以帝王為主，世家通常記諸侯，列傳則收錄各類重要人物，像是③〈項羽本紀〉與〈孔子世家〉的篇目歸類，便是依照人物當時的政治身分來決定。不過，④紀傳體不等於全書皆是人物傳記，《史記》的表把分散於各篇的年代與大事重新整理，書則呈現禮樂、曆法、水利等制度面向，與人物篇章互相補足。⑤至於《漢書》，它只記西漢一朝，屬於斷代史，與通貫古今的《史記》同屬紀傳體，只是涵蓋的時間範圍不同。","後來，為了彌補編年體、紀傳體不易集中看到事件首尾的缺點，於是出現了《通鑑紀事本末》這類以事件為主軸的史書。"],"options":[{"key":"A","text":"①"},{"key":"B","text":"②"},{"key":"C","text":"③"},{"key":"D","text":"④"},{"key":"E","text":"⑤"}],"answer":"B、D、E","explain":"解析：(A)「起因、經過、結果一次寫完」是紀事本末體的特色，編年體的事件會分散在不同年份。(C)項羽未稱帝卻列本紀，孔子不是諸侯卻列世家，歸類反映司馬遷對人物歷史地位的判斷","source":"國學導讀講義第四單元","group":""},{"n":28,"stem":"下列皆是吟詠臺灣物產的竹枝詞，所詠對象搭配正確的是：","body":[],"options":[{"key":"A","text":"日夕渾身發異香，風還雨過更彰揚。一株直插雲霄外，製腦堪誇妙處方──紅檜"},{"key":"B","text":"獨幹凌霄不作枝，垂垂青子任紛披。摘來還共蔞根嚼，贏得脣間盡染脂──荔枝"},{"key":"C","text":"滿樹花開欲灼天，落霞無復詡紅鮮。英雄本色嬌兒性，一葉青蔥不掛牽──木棉"},{"key":"D","text":"不是哀梨不是楂，酸香滋味似甜瓜。枇杷不見黃金果，番檨何勞向客誇──土芒果"},{"key":"E","text":"空谷盤根萼瓣新，隨風如蝶舞頻頻。一場春夢醒來後，畢竟莊生托爾身──蝴蝶蘭"}],"answer":"C、D、E","explain":"解析：(A)詠樟木，由「渾身發異香」、「製腦堪誇妙處方」可知。語譯：不論早晚全身散發異香，在經過風吹雨打後香氣更是明顯。一根主幹高聳入雲，是製作樟腦的最佳處方。 (B)詠檳榔，由「獨幹」、「垂垂青子」、「嚼」、「脣間盡染脂」可知。語譯：檳榔樹只有一根主幹高聳雲霄，沒有分出旁枝，上面結了大串垂下的青子，一顆顆雜亂地散開。把它摘下來加上蔞根、蠣灰一同咀嚼，把嘴脣全部都染紅了。(C)由「滿樹花開欲灼天」、「紅鮮」、「一葉青蔥不掛牽」可知。語譯：木棉花開滿一樹的模樣像要把天空灼燒，連落日晚霞都不如它紅豔光亮。擁有英雄般的豪壯氣勢卻有小孩的純然之性，開花時沒有一片綠葉掛在枝上。(D)由「酸香滋味」、「枇杷不見黃金果」可知。語譯：不是上好的梨子也不是酸澀的山楂果，又酸又香味道像甜瓜。像是枇杷卻沒有黃金果肉，土芒果的美味何須費口舌向客人誇耀。(E)由「空谷」（空谷幽蘭）、「如蝶舞」及「莊周夢蝶」之典故可知。語譯：根植於寂靜的山谷開出鮮嫩的花，隨風搖擺的姿態宛如翩翩飛舞的蝴蝶。從一場春風醒來後，才知終歸是莊子在夢中幻化成你的模樣","source":"課外文選練習題","group":""},{"n":29,"stem":"依據圖中甲至己的對話內容，選項中的判斷哪些正確？","body":[],"options":[{"key":"A","text":"甲的說法較接近儒家重視禮序與名分的主張"},{"key":"B","text":"乙與甲同樣出於「愛有差等、由親及疏」的儒家立場"},{"key":"C","text":"丙著重名稱與實際內容是否相符，較接近名家"},{"key":"D","text":"丁善於遊說、審勢權變，其想法較接近陰陽家"},{"key":"E","text":"戊、己處理同一問題的方向相反，前者近法家，後者近道家"}],"answer":"A、C、E","explain":"解析：(A)甲主張依「長幼有序」安排先後，較接近儒家重視禮序、名分的思想。(B)乙主張即使有人沒帶錢，也可以先代為支付，希望大家都能喝到飲料，較接近墨家「兼愛」精神。儒家之愛具有親疏層次，墨家則強調兼相愛，兩者並不相同。(C)丙追問「去冰」究竟是完全沒有冰塊，還是仍有少量碎冰，著重「名稱」與「實際內容」是否相符，較接近名家對名實關係的辨析。(D)丁先比較兩家店的條件，再設法說服大家選擇較有利的一方，呈現遊說、審勢與權變的特色，較接近縱橫家，並非陰陽家。(E 川"},{"key":"C","text":"作者透過想像建構出僅有自己與河川的空間，呈現寧靜平和的氛圍"},{"key":"D","text":"澄澈的河水如同嬰兒一般單純，因此作者期盼河川能永遠如嬰兒一樣純淨"},{"key":"E","text":"藉水草根植河底，隨波蕩漾的形象，展現作者對河川的依戀"}],"answer":"C、E","explain":"解析：(A)文中未提河川的哪個區段最能讓作者有安全感。(B)作者對河川的喜愛並不只因其與自己的童年往事相關。(D)作者是「像祝福嬰兒一樣祝福河川」，而非「期盼河川和嬰兒一樣純淨」。且其祝願是希望河川平安、燦爛","source":"課文筆記","group":""}],"vocab":[{"n":1,"stem":"靡","answer":"無、沒有。","explain":"","source":"段考字詞解釋"},{"n":2,"stem":"洎","answer":"等到、及至。","explain":"","source":"段考字詞解釋"},{"n":3,"stem":"水「潦」","answer":"淹水。","explain":"","source":"段考字詞解釋"},{"n":4,"stem":"黌序","answer":"學校。","explain":"","source":"段考字詞解釋"},{"n":5,"stem":"迤邐","answer":"緩緩前行的樣子。","explain":"","source":"段考字詞解釋"},{"n":6,"stem":"闤闠","answer":"市場。","explain":"","source":"段考字詞解釋"},{"n":7,"stem":"爬梳","answer":"將紛亂的事物梳理出次序。","explain":"","source":"段考字詞解釋"},{"n":8,"stem":"萬瓦如甃","answer":"鹽田下方的瓦片有如井壁一般。","explain":"","source":"段考字詞解釋"},{"n":9,"stem":"鏡花水月","answer":"比喻虛幻而不真實。","explain":"","source":"段考字詞解釋"},{"n":10,"stem":"滄海桑田","answer":"比喻世事變化迅速。","explain":"","source":"段考字詞解釋"}],"mixed":[{"n":1,"stem":"根據上文， 下列① 、② 是否符合「基礎建設即權力觸手」的觀點， 最適當的研判是：（占2分，單選）","body":["①日治縱貫鐵路與當代高鐵，都是打造都市中心化／邊緣化的推手。","②對殖民者而言，基礎建設有助於鞏固統治與資源掠奪。"],"options":[{"key":"A","text":"① 、②皆符合"},{"key":"B","text":"①符合， ②不符合"},{"key":"C","text":"①不符合， ②符合"},{"key":"D","text":"① 、②不皆符合"}],"answer":"A","explain":"解析：①從日本以南北縱貫鐵路取代鹿港東西海運、當代高鐵強化南北核心，使雲彰成邊陲，可知鐵路基礎建設的確\n會造成都市中心化或邊緣化。故①符合「基礎建設即權力觸手」的觀點。而「納入帝國資源鏈」，意謂日治政府發展南北鐵路，是為了掠奪臺灣物產，北輸內地，並迅速鞏固統治。故②亦符合上述觀點。綜合以上，答案為(A)","source":"洪繻〈鹿港乘桴記〉及批判地理學對話題組"},{"n":2,"stem":"根據上文， 批判地理學最關注的議題是：（占2分，單選）","body":[],"options":[{"key":"A","text":"交通建設與工程技術的改良"},{"key":"B","text":"空間生產與權力結構的互動"},{"key":"C","text":"歷史文化對空間記憶的召喚"},{"key":"D","text":"氣候變遷對地方產業的影響"}],"answer":"B","explain":"解析：批判地理學的核心在於分析「空間如何被權力結構塑造，並反過來鞏固不平等」（如對話中提及殖民鐵路強化資源掠奪），因此(B)為正解。(A)屬於技術層面的關懷。(C)屬於空間歷史記憶的重構。(D)屬環境地理、經濟地理的範\n疇，以上皆非批判地理學的理論焦點。","source":"洪繻〈鹿港乘桴記〉及批判地理學對話題組"},{"n":3,"stem":"依據文意， 為上文中的空格甲、乙、丙填入最適切的答案。","body":[],"options":[],"answer":"甲、乙、丙三個填空題","source":"洪繻〈鹿港乘桴記〉及批判地理學對話題組","explain":"","subparts":[{"id":1,"stem":"(1)面對鹿港港口嚴重淤積， 日人提出什麼替代方案， 其真實目的為何？ 請節錄原文作答， 填入空格甲。（占2 分， 作答字數：20字以內。）","answer":"鹽田之築，輸巨貲供官府之收厚利（或答：鹽田之築，實民間之輸巨貲以供官府之收厚利）","score":"2 分"},{"id":2,"stem":"(2)日人對鹿港造成了何種空間暴力的後果？請依據引文前後脈絡，自〈鹿港乘桴記〉找出對應的文句，填入空格乙。（占2 分，作答字數：5字以內。）","answer":"瓦礫成丘","score":"2 分"},{"id":3,"stem":"(3)文末，洪繻以何景象象徵鹿港正籠罩在飄忽不定的氛圍中？請摘引原文作答， 填入空格丙。（占2 分，作答字數： 10 字以內。）","answer":"遠近燈火明滅","score":"2 分"}]}],"groups":{"16–17 題組":["（甲）","造化鍾奇構，崇岡湧沸泉。怒雷翻地軸，毒霧撼崖巔。","碧澗松長槁，丹山草欲燃。蓬瀛遙在望，煮石迓神仙。(郁永河〈北投硫穴詩〉其一)","（乙）","五月行人少，西陲有火山。孰知泉沸處，遂使履行難。","落粉銷危石，流黃漬篆斑。轟聲傳十里，不是響潺湲。(郁永河〈北投硫穴詩〉其二)","注釋：鍾：聚集。蓬瀛：指蓬萊山、瀛洲山，相傳神仙所居之地。煮石：比喻修仙。迓：迎接。篆斑：斑駁的紋路。"],"18–19 題組":["賴和接受現代化的進步觀念，所以他能夠客觀地發掘臺灣舊社會的迂腐與落後。從〈鬥鬧熱〉開始，賴和透過文學的經營揭發封建文化的凝滯與欺罔。一九二九年，他發表〈蛇先生〉，拆穿傳統漢醫借用祕方，在鄉間招搖撞騙。一九三○年又發表〈棋盤邊〉，對日本的鴉片特許政策進行批判，同時也撻伐舊士紳的墮落。一九三一年另有一篇〈可惜她死了〉，則是抨擊封建社會的納妾惡習。賴和撰寫這些小說的迫切心情，幾透紙背。他知道，現代化是無可抵擋的。臺灣社會若不進行文化改造，則永無翻身之地。","然而，他更清楚現代化對臺灣社會也具有雙刃性的作用。臺灣若不追求現代化，就必須接受被支配的命運。不過，現代化並非是從臺灣社會內部自發性產生，而是由日本人以強制性手法加諸臺灣人身上。因此，殖民地知識分子如賴和者，已深深體會到文化上的兩難。如果臺灣人要抵抗殖民統治，就連帶要抵制現代化；如果要接受現代化，則又同時要接受殖民統治。這種矛盾，在賴和及其同時代作家的文學中表現得最為鮮明。","在賴和小說中最常看見的主題，便是對法律的愛恨交織。法律是現代資本主義的基礎，依賴它才能維持一個有秩序、有效率、有理性的社會。但是，臺灣的資本主義是以支撐殖民體制為優先：在理性的假面之下，法律並不是要照顧手無寸鐵的百姓，而是要護航權力氾濫的統治者。從〈一桿「稱仔」〉開始，賴和就批判法律的失衡。所謂正義，只是向官方片面傾斜。（陳芳明〈啟蒙實驗時期的臺灣文學〉）"],"20–21 題組":["我果戰士有勇，大將有謀，成算在胸，地利足恃，猶不如誘之登岸而設伏殲之。不然，汪洋海上以數百人操一舟，東馳西突，以角逐於勝負不可知之地，我即無恙，而彼之所挾者小，我之所勞者大，設防設守，形勢不亦懣乎！然誘之上岸，非有成算，則斷不可。蓋敵一登陸，民心易動，軍心易震，非宿將強兵不能得手也。生，臺人也，為臺灣計，臺北可誘之近岸，臺南則不可。蓋臺北港道深通而有屏蔽，彼之駐輪甚便；若登岸，則反失所恃。臺南則港門雖深，風浪甚苦，四圍無山，港中非可駐輪；彼不登岸，不能久居也。若臺中諸港，沙線淺灘，難駛鐵船。然澎湖不守，則敵人得之，安穩收泊。有時展輪四掠，有時載小艇窺闖，臺中難防，臺南、北亦可慮。（洪繻〈籌海議〉）"],"22–25 題組":["【甲】","「花菜賣多少錢？」巡警問。","「大人要的，①不用問價；肯要我的東西，就算運氣好。」參說。他就擇幾莖好的，用稻草貫著，恭敬地獻給他。","②「不，稱稱看！」巡警幾番推辭著說，誠實的參，亦就掛上稱仔稱一稱，說：「大人，真客氣啦！才一斤十四兩。」本來，經過秤稱過，就算買賣，就是有錢的交關，不是白要，亦不能說是贈與。","「不錯罷？」巡警說。","「不錯，本來兩斤足，因是大人要的……」參說。這句話是平常買賣的口吻，不是贈送的表示。","「稱仔不好罷，兩斤就兩斤，何須打扣？」巡警變色地說。","「不，還新新呢！」參泰然地回答。","「拿過來！」巡警赫怒了。","「稱花還很明瞭。」參從容地捧過去說。巡警接在手裡，約略考察一下，說：","「不堪用了，拿到警署去！」","「什麼緣故？修理不可嗎？」參說","「不去嗎？」巡警怒叱著。「不去？畜生！」撲的一聲，巡警把稱仔打斷擲棄，隨抽出胸前的小帳子，把參的名姓、住處記下，氣憤憤地回警署去。","參突遭這意外的羞辱，空抱著滿腹的憤恨，在擔邊失神地站著。等巡警去遠了，才有幾個閒人，近他身邊來。一個較有年紀的說：","「該死的東西，到市上來，只這規紀亦就不懂，要做什麼生意？汝說幾斤幾兩，難道他的錢汝敢拿嗎？」(賴和〈一桿稱仔〉)","【乙】","查大人聽人們騷動的聲，已明白近處有犯法的事故。可是待他趕到現場人已走空，只剩下幾個兒童欣羨似地立在那邊，注視著來不及收，遺下的銅貨銀鈸和賭具。查大人捉不到犯人，隨便拉一個兒童，玩笑似地問：「喂！囝仔，什麼人賭錢的？」查大人的威聲，本可喝止夜啼的孩子，那個兒童不明白地被他拉住，當然吃不少驚，然後啼哭了起來。不幸這個兒童，竟遇到這厭惡哭聲的查大人。他常說：③啼哭是弱者的呼喊，無用者的祈求，頂卑劣的舉動，有污辱人的資格，尤其是一等國民的面子。所以他就用教訓的意義，輕輕地打他一掌說：「緘點著！不許哭，賭錢的什麼人？」很有效力，這一下子打，那兒童立刻止住哭聲，偷偷地用手來摩擦著印有指痕紅腫的嘴巴。","「不說嗎？到衙門去！」","有一位似較有膽量的人，走向前去：「大人！賭錢，他不……」","「豬！誰要你插嘴？」","唉！本來可以無事的那個兒童，④被人們的同情心，拖累得更不幸了。在查大人的思想，官事一點也不容許人民過問，他本無為難這兒童的意志。但到現在就不能隨便了事，怕被世間誤解，以為受到抗議才釋放他。這很關礙做官的尊嚴。做官的不會錯，現在已經成為定理。那個兒童總須有些事實，以表明他罪有應得，要他供出事實來，就須拉進衙門審問。這是法律所給的職權。(改寫自賴和〈不如意的過年〉) 查大人：日治時代臺灣人對日本警察的稱呼，意同巡警。"]},"mixedContext":[{"role":"原文","text":"蓋鹿港扼南北之中，其海口去閩南之泉州， 僅隔一海峽而遙。…… 而是時鹿港通海之水已淺可涉矣， 海艟之來， 止泊於沖西內津，昔之所謂「鹿港飛帆」者，已不概見矣。綑載之往來，皆以竹筏運赴大艑矣。然是時之竹筏，猶千百數也，衣食於其中者，尚數百家也。迄於今版圖既易，海關之吏猛於虎豹，華貨之不來者有之矣。洎乎火車之路全通，外貨之來由南北而入，不復由鹿港而出矣。重以關稅之苛、關吏之酷，牟販之夫多至破家，而閩貨之不能由南北來者， 亦復不敢由鹿港來也。鹽田之築，肇自近年。日本官吏固云欲以阜鹿民也，而其究竟，則實民間之輸巨貲以供官府之收厚利而已。且因是而阻水不行，山潦之來，鹿港人家半入洪浸，屋廬之日就頹毀、人民之日即離散，有由然矣。余往年攜友乘桴游於海濱，……向時估帆所出入者，時已淤為沙灘，為居民鋤作菜圃矣。……望街尾一隅而至安平鎮，則割臺後之飛甍鱗次數百家燬於丙申兵火者，今猶瓦礫成丘，荒涼慘目也。猶幸市況凋零，為當道所不齒，不至於市區改正，破裂闤闠，驅逐人家以為通衢也。然而再經數年，則不可知之矣。滄桑時之可怖心，類如此也。游興已終，舍桴而步。遠近燈火明滅，屈指盛時所號萬家邑者，今裁三千家而已，可勝慨哉！（洪繻〈鹿港乘桴記〉）"},{"role":"討論情境","text":"※\n吉伊：教授，我把要討論的〈鹿港乘桴記〉貼在上頭。上次您提到洪繻筆下「火車之路全通」是殖民空間生產的象徵， 但鐵路不是促進發展嗎？\n小八：問得好！ 批判地理學強調「基礎設施即權力觸手」。日治鐵路以「南北縱貫」取代鹿港「東西海運」， 將臺灣納入帝國資源鏈。對鹿港的影響，就像當代高鐵通車初期， 強化了「臺北—高雄」核心軸， 使雲林、彰化淪為「過站」邊陲。\n兔哥：對！我阿祖說火車通後，原本碼頭扛貨的兩百多人只剩十來個轉行晒鹽。鹽田後來改為農田，也發展過觀光， 但年輕人還是北漂……\n吉伊：文中「  甲  」， 簡直剝削人民！ 那當代風電進駐彰濱，算新形態剝奪嗎？\n小八：尖銳的問題！大衛‧哈維（David Harvey）的「剝奪性積累」在此上演：殖民者以「公共建設」名義徵地製鹽， 卻使財富和權力集中在少數人手中……正如現在政府劃定綠電區，在地漁民反成「阻礙進步」的他者。\n吉伊：洪繻描寫街尾一帶「  乙  」的廢墟景象， 正是殖民者空間暴力所造成的後果，但我們能如何保存地景記憶？\n兔哥：我們組了「鹿港口述史團隊」，用AR 重現碼頭帆影。就像高雄哈瑪星居民爭取鐵道文化園區，抵抗都更抹煞！\n小八：這就是米歇爾‧德‧塞爾托（Michel de Certeau）說的「日常實踐戰術」！當官方將鹿港建構成「靜態古蹟」時，你們卻用科技活化展演「動態歷史」。\n吉伊：所以批判地理學只能揭露黑暗面嗎？\n小八：不！愛德華‧蘇賈（Edward Soja）的「第三空間理論」指出縫隙中的能動性。就像洪繻在文中所埋藏的抵抗意識── 「  丙  」，這一明一滅既是慨歎，是殖民現代性的幽光， 也暗示地方生命力的殘存。\n兔哥：是啊！我們正在推動「輕軌復興提案」，發展觀光軌道，希望讓鐵路建設的功能從「切割」變成「縫合」。"}]}</script>

(()=>{

 $('tabs').innerHTML=order.map(t=>'<button type="button" class="tab '+(t===current.type?'active':'')+'" data-type="'+t+'" aria-pressed="'+(t===current.type)+'">'+specs[t].label+'</button>').join('');
 $('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>set(b.dataset.type,specs[b.dataset.type].min));
 const s=specs[current.type];$('numberInput').value=current.n;$('numberInput').setAttribute('min',(current.type==='single'||current.type==='multiple')?1:s.min);$('numberInput').setAttribute('max',(current.type==='single'||current.type==='multiple')?30:s.max);
 $('helper').className='helper';$('helper').textContent=s.label+'：第 '+s.min+'～'+s.max+' 題'+(current.type==='mixed'?'（第 3 題含 3 小題）':'');
 $('quickJump').innerHTML=Array.from({length:s.max-s.min+1},(_,i)=>s.min+i).map(n=>'<button type="button" data-n="'+n+'" class="'+(n===current.n?'active':'')+'" aria-label="第'+n+'題">'+n+'</button>').join('');
 $('quickJump').querySelectorAll('button').forEach(b=>b.onclick=()=>set(current.type,Number(b.dataset.n),true,true));
}
function readings(q){let content='',label='';
 if(current.type==='mixed'){
  label='混合題｜共用閱讀材料';content=data.mixedContext.map(x=>'<div class="contextgroup"><strong>'+escapeHTML(x.role)+'</strong><div class="reading-inner '+(x.role==='討論情境'?'conversation':'')+'">'+x.text.split('\n').filter(Boolean).map(para).join('')+'</div></div>').join('');
 }else if(q.group){label=q.group+'｜共用閱讀材料';content='<div class="reading-inner">'+(data.groups[q.group]||[]).map(para).join('')+'</div>';}
 $('reading').style.display=content?'block':'none';$('reading').innerHTML=content?'<div class="reading-head"><span class="smallchip">閱讀材料</span>'+escapeHTML(label)+'</div><details open><summary>點此收合／展開原文</summary>'+content+'</details>':'';
}
function question(q){const s=specs[current.type],ans=q.answer?.split('、')||[];
 let str='<div class="qtop"><div class="qmeta"><span class="qnumber">'+s.label+' · 第 '+q.n+' 題</span><span class="smallchip">'+(current.type==='single'?'2 分':current.type==='multiple'?'4 分':current.type==='vocab'?'2 分':current.type==='mixed'?'依小題配分':'')+'</span></div></div>';
 str+='<h2>'+escapeHTML(q.stem)+'</h2>';
 if(q.body?.length)str+='<div class="qcontext">'+q.body.map(para).join('')+'</div>';
 if(q.image)str+='<div class="picture"><img class="zoomable" src="'+q.image+'" alt="第29題的六位學生LINE群組對話，甲至己討論點飲料的方式"><div class="pic-hint">點按圖片可放大閱讀</div></div>';
 if(q.table)str+=q.table;
 if(q.options?.length)str+='<ol class="options">'+q.options.map(o=>'<li class="option '+(ans.includes(o.key)?'correct':'')+'"><span class="letter">'+escapeHTML(o.key)+'.</span><span class="optiontext">'+escapeHTML(o.text)+'</span></li>').join('')+'</ol>';
 if(q.subparts?.length)str+='<div class="subparts">'+q.subparts.map(s=>'<section class="subpart"><span class="score">'+escapeHTML(s.score)+'</span><div class="substem">'+escapeHTML(s.stem)+'</div><div class="subanswer"><strong>參考答案：</strong>'+escapeHTML(s.answer)+'</div></section>').join('')+'</div>';
 $('questionBody').innerHTML=str;
 const showAnswer=current.type!=='mixed'||q.n<3;
 $('answerArea').innerHTML='<div class="answerheading">'+(q.subparts?'填答參考':'ANSWER & EXPLANATION｜答案與詳解')+'</div>'+(showAnswer?'<div class="answerrow"><span class="answerpill">'+escapeHTML(q.answer)+'</span></div>':'')+(q.explain?'<div class="explanation">'+q.explain.split('\n').filter(Boolean).map(para).join('')+'</div>':'')+(q.source?'<div class="source"><strong>出處</strong>　'+escapeHTML(q.source)+'</div>':'');
 $('prev').disabled=current.n===s.min;$('next').disabled=current.n===s.max;
 const photo=document.querySelector('.zoomable');if(photo)photo.addEventListener('click',()=>{const z=$('zoom');z.querySelector('img').src=photo.src;z.classList.add('open')});
}
function render(){const q=item();if(!q)return;sections();readings(q);question(q);}
$('searchForm').addEventListener('submit',e=>{e.preventDefault();const raw=$('numberInput').value.trim();const n=Number(raw);let t=current.type;if((t==='single'||t==='multiple')&&n>=1&&n<=30)t=n<=25?'single':'multiple';const s=specs[t];if(!/^\d+$/.test(raw)||!Number.isInteger(n)||n<s.min||n>s.max){$('helper').className='helper error';$('helper').textContent='請輸入有效題號（'+specs[current.type].min+'～'+specs[current.type].max+'）。';return;}set(t,n,true,true)});
$('prev').onclick=()=>{if(current.n>specs[current.type].min)set(current.type,current.n-1,true,true)};
$('next').onclick=()=>{if(current.n<specs[current.type].max)set(current.type,current.n+1,true,true)};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);$('copy').textContent='已複製！';setTimeout(()=>$('copy').textContent='複製本題連結',1500)}catch(e){prompt('複製此網址',location.href)}};
$('zoom').onclick=()=>{$('zoom').classList.remove('open');$('zoom').querySelector('img').removeAttribute('src')};
window.addEventListener('keydown',e=>{if(e.key==='Escape')$('zoom').click()});
window.addEventListener('popstate',()=>{current={type:'single',n:1};fromUrl();render()});
fromUrl();render();
})();
</script>
</body>
</html>
