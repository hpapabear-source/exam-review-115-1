<script>const DB={"questions":{"1":{"stem":"下列各組「」內的字，讀音前後相同的是：","context":[],"options":[{"id":"A","text":"不「諳」世事／「黯」然神傷"},{"id":"B","text":"「共」其乏困／香花「供」養"},{"id":"C","text":"原書亡「佚」／「軼」聞趣事"},{"id":"D","text":"名豈文章「著」／脫帽「著」帩頭"}],"answer":["C"],"explanation":["(A)ㄢ／ㄢˋ。(B)ㄍㄨㄥ／ㄍㄨㄥˋ。(C)ㄧˋ。(D)ㄓㄨˋ／ㄓㄨㄛˊ。"],"translation":[],"source":"習作","num":1,"section":"single","group":null,"graphic":null},"2":{"stem":"下列文句，完全沒有錯別字的是：","context":[],"options":[{"id":"A","text":"他向來諱疾忌醫，多年的好友又音訊杳然，近來總顯得憂心忡忡"},{"id":"B","text":"這座寺廟冠宇莊嚴，壁上人物彩繪詡詡如生，吸引遊客駐足欣賞"},{"id":"C","text":"工程團隊日夜趕工，終於依照原定日期峻工，居民無不額手稱慶"},{"id":"D","text":"他雖然家徒四壁，仍潛心鑽研醫術，深信三折紘而成良醫的古訓"}],"answer":["A"],"explanation":["(B)「冠」→「觀」；「詡詡」→「栩栩」。(C)「峻」→「竣」。(D)「紘」→「肱」。"],"translation":[],"source":"習作、大卷","num":2,"section":"single","group":null,"graphic":null},"3":{"stem":"下列文句畫底線的詞語，運用適當的是：","context":[],"options":[{"id":"A","text":"他為爭取主管職位多年勤奮加班，甚至犧牲休假時間，堪稱摩頂放踵的最佳典範"},{"id":"B","text":"兩家公司多年合作互有獲益，即使景氣低迷仍彼此支持，足見雙方結草銜環之情"},{"id":"C","text":"公司草創時倚重老臣四處奔走，待營運穩定後卻逐一撤換，引來兔死狗烹之譏"},{"id":"D","text":"畢業多年後同學終於齊聚一堂，大家引領而望，回憶昔日校園生活與青春往事"}],"answer":["C"],"explanation":["(A)摩頂放踵：從頭頂到腳跟都磨傷，形容不辭勞苦、捨己為人。句中只是為自己爭取職位而辛勤工作，並無「利他、犧牲自己成全他人」之意，使用不當。(B)結草銜環：比喻感恩報德，至死不忘。句中只是兩家公司長期互惠合作，並非一方受恩後圖報，語意不合。(C)兔死狗烹：比喻事情成功後，便把曾經出力的功臣拋棄或除去。公司草創時倚重老臣，營運穩定後卻將其撤換，符合此義，使用適當。(D)引領而望：伸長脖子遠望，形容殷切盼望。句中同學已經相聚，正在回憶往事，並沒有等待、盼望的情境，使用不當。"],"translation":[],"source":"習作","num":3,"section":"single","group":null,"graphic":null},"4":{"stem":"某文創書店將古籍名句印製成書籤，下列哪些語句的原始出處來自「經部」典籍？","context":["ㄅ、學而時習之，不亦說乎。","ㄆ、若亡鄭而有益於君，敢以煩執事。","ㄇ、醉翁之意不在酒，在乎山水之間也。","ㄈ、養生喪死無憾，王道之始也。","ㄉ、緣溪行，忘路之遠近，忽逢桃花林。","ㄊ、老劉，老劉，食量大似牛，吃一個老母豬不抬頭。"],"options":[{"id":"A","text":"ㄅ、ㄆ、ㄈ"},{"id":"B","text":"ㄅ、ㄇ、ㄈ"},{"id":"C","text":"ㄆ、ㄈ、ㄊ"},{"id":"D","text":"ㄅ、ㄉ、ㄊ"}],"answer":["A"],"explanation":["ㄅ出自《論語》，屬經部。ㄆ出自《左傳．燭之武退秦師》。《左傳》屬《春秋》三傳之一，歸入經部。ㄇ出自歐陽脩〈醉翁亭記〉，屬作家文章作品，歸入集部。ㄈ出自《孟子》，屬儒家經典，歸入經部。ㄉ出自陶淵明〈桃花源記〉，屬個人文集作品，歸入集部。ㄊ出自《紅樓夢》，未收入四庫全書。"],"translation":[],"source":"國學講義","num":4,"section":"single","group":null,"graphic":null},"5":{"stem":"下列文句的修辭，何者說明正確？","context":[],"options":[{"id":"A","text":"乘其車，揭其劍，過其友──層遞"},{"id":"B","text":"宮中積珍寶，狗馬實外廄，美人充下陳──錯綜"},{"id":"C","text":"狡兔有三窟，僅得免其死耳──誇飾"},{"id":"D","text":"孟嘗君怪其疾也，衣冠而見之──轉化"}],"answer":["B"],"explanation":["(A)排比。(B)錯綜的調整語法。珍寶積宮中→宮中積珍寶。積、實、充為抽換詞面。(C)借喻：比喻有多處藏身的地方或多種避禍的準備。強調避禍之計的重要。(D)轉品：「衣冠」名詞轉動詞用。"],"translation":[],"source":"課外文選練習題","num":5,"section":"single","group":null,"graphic":null},"6":{"stem":"志怪小說中的「空間變換」描寫，能給讀者帶來法術神奇、不可思議的體驗，下列〈勞山道士〉當中道士的施法過程描寫，屬於描述「空間變換」的選項是：","context":[],"options":[{"id":"A","text":"師乃剪紙如鏡，黏壁間。俄頃，月明輝室，光鑑毫芒"},{"id":"B","text":"（嫦娥）歌畢，盤旋而起，躍登几上。驚顧之間，已復為箸"},{"id":"C","text":"三人移席，漸入月中。眾視三人坐月中飲，鬚眉畢見，如影之在鏡中"},{"id":"D","text":"遂各覓盎盂，競飲先釂，惟恐樽盡，而往復挹注，竟不少減"}],"answer":["C"],"explanation":["(A)描寫道士剪紙為月，「俄頃」說明施展法術的流暢自然，屬於時間推移的描述。(B)為箸化嫦娥的法術，「驚顧之間」說明箸與嫦娥轉變的突發性，更顯道士法術高妙。(C)描寫道士和賓客變換宴飲場所，產生「空間變換」。(D)僅描述眾人爭相找尋酒杯、喝酒的情景，往來多次，也未見酒減少。"],"translation":[],"source":"課本筆記","num":6,"section":"single","group":null,"graphic":null},"7":{"stem":"關於杜甫〈旅夜書懷〉一詩的賞析，說明正確的選項是：","context":[],"options":[{"id":"A","text":"首四句由景寫起，場景由大而小，由遠而近，產生相襯的效果"},{"id":"B","text":"「星垂平野闊，月湧大江流」二句易使人產生「今人不見古時月，今月曾經照古人」之感懷"},{"id":"C","text":"「名豈文章著？官應老病休」透露杜甫希望能在政治上有所成就，無奈事與願違"},{"id":"D","text":"「飄飄何所似？天地一沙鷗」是作者感嘆自己因浪漫不羈而淪落天涯"}],"answer":["C"],"explanation":["(A)場景由小而大，由近而遠，以大襯小，凸顯詩人的「獨」。(B)此二句以雄渾之景襯出詩人孤苦流離的形象及淒愴心情。「今人不見古時月，今月曾經照古人」表達人生短暫而宇宙永恆之慨。出自李白〈把酒問月〉。"],"translation":["語譯： 今人不曾見過古時的月亮。而今人現在所看到的月亮，卻曾經照過古時候的人。(D)作者感嘆天地之大，卻找不到安身之地。"],"source":"課本筆記","num":7,"section":"single","group":null,"graphic":null},"8":{"stem":"以下這段關於晉文公退兵的理由，下列說明正確的是：","context":["子犯請擊之。公曰：「不可，①微夫人之力不及此。②因人之力而敝之，不仁；③失其所與，不知；④以亂易整，不武。吾其還也！」"],"options":[{"id":"A","text":"①體現了「以德報怨」的精神氣度"},{"id":"B","text":"②展現「君子懷德」的智慧謀慮"},{"id":"C","text":"③是能夠明白「比而不周」的道理"},{"id":"D","text":"④是告誡子犯「勇而無禮則亂」的守則"}],"answer":["B"],"explanation":["(A)「微夫人之力不及此」是指晉文公在秦穆公的幫助下，方得歸返晉國登基一事，而晉文公不忘秦穆公對己的恩惠，故應為「以德報德」。(B)「因人之力而敝之，不仁」是晉文公認為不應憑藉秦穆公的助力卻反過來傷害他，展現「君子懷德」的原則與風範。"],"translation":["語譯： 君子一心想保有美德。(C)「失其所與，不知」指晉國若強硬出兵將導致失去原本親附自己的盟國，這是不明智的，此非「比而不周」之舉。語譯：結黨營私，不會普遍為全體著想。(D)「以亂易整，不武」是晉文公告誡子犯用分裂代替團結，不合武德的道理，而非指不合禮節，便會破壞秩序。語譯：好勇而不合禮便會犯上作亂。"],"source":"課本筆記相關","num":8,"section":"single","group":null,"graphic":null},"9":{"stem":"下列有關黃庭堅〈寄黃幾復〉一詩的敘述，正確的是：","context":[],"options":[{"id":"A","text":"「我居北海君南海，寄雁傳書謝不能」中透過「海」字表達出兩人重逢茫茫無期之感"},{"id":"B","text":"「桃李春風一杯酒，江湖夜雨十年燈」表達出作者對於「十年寒窗無人問，一舉成名天下知」的感慨"},{"id":"C","text":"「持家但有四立壁，治病不蘄三折肱」以「三折肱」表達作者經過磨練，終於功成名就"},{"id":"D","text":"「想得讀書頭已白，隔溪猿哭瘴煙藤」為作者勉勵好友只要堅持不懈，就能感動萬物有所成就"}],"answer":["A"],"explanation":["(B)作者敘寫舊遊歡聚之樂，及別後的蕭索孤寂，對比強烈。(C)作者在此為具治國長才的好友打抱不平，提出對「三折肱」的質疑。(D)透過「想得」表達出對朋友的了解與思念，也憐惜對方在苦境中奮發向上，卻不受重用的情形。"],"translation":[],"source":"課本筆記","num":9,"section":"single","group":null,"graphic":null},"10":{"stem":"以下是兩段針對〈勞山道士〉的言論，請選出說明正確的選項：","context":["（甲）異史氏曰：「聞此事未有不大笑者；而不知世之為王生者，正復不少。今有傖父，喜疢毒而畏藥石，遂有舐癰吮痔者，進宣威逞暴之術，以迎其旨，詒之曰：『執此術也以往，可以橫行而無礙。』初試未嘗不小效，遂謂天下之大，舉可以如是行矣，勢不至觸硬壁而顛蹶不止也。」（蒲松齡〈勞山道士〉）","（乙）文評自明。亦以見學問之途，非浮慕者所得與。雖有名師，亦且俟其精進有得，而後舉其道以傳之；苟或作或輟，遂欲剽竊一二以盜名欺世，其不觸處自踣者幾希！（清但明倫評〈勞山道士〉"],"options":[{"id":"A","text":"甲文中「舐癰吮痔者」指個性像王生的人"},{"id":"B","text":"乙文中「浮慕者」指像王生一樣慕道而淺薄的人"},{"id":"C","text":"乙文認為求道成功與否的關鍵，在於找對名師"},{"id":"D","text":"甲乙皆批評王生的行徑，且點出實際改進的方向"}],"answer":["B"],"explanation":["(A)文中的「傖父」才是指個性像王生的人，由「喜疢毒而畏藥石」的個性、以為小術可以橫行天下的行為可知和王生的情節相呼應。「舐癰吮痔者」指諂媚、進獻歪邪小術給他的人。(B)「浮慕者」呼應課文中王生的「慕道」，指像王生一樣慕道而淺薄的人無法求得學問。(C)由「雖有名師，亦且俟其精進有得，而後舉其道以傳之」可知，求道的關鍵在於學習者自己的精進。(D)並無點出實際改進的方向。"],"translation":["語譯（乙） 異史氏的評論已很清楚。也可以看出學問的路途，不是浮泛的人所能進入的。即使有名師，尚且要等待學者精進有得，才會將他的道傾囊相授。如果或學或停，就想要剽竊一二來盜取虛名、欺騙世俗，那不到處碰壁也就很少了。"],"source":"課本、延伸","num":10,"section":"single","group":null,"graphic":null},"11":{"stem":"依據下文，關於①、②的研判，最適當的是：","context":["凡說之難，非吾知之有以說之之難也，又非吾辯之能明吾意之難也，又非吾敢橫佚而能盡之難也。凡說之難，在知所說之心，可以吾說當之。（《韓非子》）","①燭之武對秦伯說：「若亡鄭而有益於君，敢以煩執事」，運用了「吾知之有以說之」與「知所說之心，可以吾說當之」。","②馮諼對梁惠王說：「齊放其大臣孟嘗君於諸侯，諸侯先迎之者，富而兵強」，運用了「吾辯之能明吾意」與「吾敢橫佚而能盡」。"],"options":[{"id":"A","text":"①、②皆正確"},{"id":"B","text":"①、②皆錯誤"},{"id":"C","text":"①正確，②錯誤"},{"id":"D","text":"①錯誤，②正確"}],"answer":["C"],"explanation":["①燭之武對秦伯說：「若亡鄭而有益於君，敢以煩執事」，是站在秦伯的立場，分析攻鄭的利害，既符合對方的心理也展現自己的才智，故符合「吾知之有以說之」與「知所說之心，可以吾說當之」。","②馮諼對梁惠王說：「齊放其大臣孟嘗君於諸侯，諸侯先迎之者，富而兵強」，是想挾外援以抬高孟嘗君的重要性，藉以重返齊國相位。他對梁惠王所說的話，並不是內心真正的目的，故不符合「吾辯之能明吾意」與「吾敢橫佚而能盡」。"],"translation":["語譯： 大抵而言，說服的困難，不是難在我必須具備足以說服對方的聰明才智，也不是難在我必須具備能夠闡明個人意見的辯才，也不是難在我必須毫無顧忌地把內心的話完全表達出來。大抵而言，說服的困難，在於了解說服對象的心理，才能使我的說法符合他的心理。"],"source":"110指考","num":11,"section":"single","group":null,"graphic":null},"12":{"stem":"關於〈夜雨寄北〉一詩的解說，下列選項正確的是：","context":[],"options":[{"id":"A","text":"本詩保有李商隱詩作風格典麗、擅於用典的風格"},{"id":"B","text":"本詩中的「雨」象徵詩人和故友無法相聚的阻撓"},{"id":"C","text":"「問君歸期未有期」和「君子之德風」的「君」字相同，皆表示上位者"},{"id":"D","text":"刻意重複提及「期」、「巴山夜雨」等關鍵字詞，產生複沓的聲音美感"}],"answer":["D"],"explanation":["(A)用典雖為李商隱的特色，但本詩中並未凸顯。(B)象徵詩人對故友的綿綿思念。(C)僅「君子之德風」的「君」表示上位者。"],"translation":[],"source":"課本筆記","num":12,"section":"single","group":null,"graphic":null},"13":{"stem":"閱讀王安石讀孟嘗君列傳，選出說明正確的選項：","context":["世皆稱孟嘗君能得士，士以故歸之；而卒賴其力，以脫於虎豹之秦。嗟乎！孟嘗君特雞鳴狗盜之雄耳，豈足以言得士？不然，擅齊之強，得一士焉，宜可以南面而制秦，尚何取雞鳴狗盜之力哉？夫雞鳴狗盜之出其門，此士之所以不至也。"],"options":[{"id":"A","text":"作者從門下食客的多寡判斷孟嘗君的優劣"},{"id":"B","text":"作者感嘆孟嘗君沒有更多像馮諼一般的謀士，否則應可戰勝秦國"},{"id":"C","text":"作者對孟嘗君的評價和世人不同，認為有待商榷"},{"id":"D","text":"文中採兩組設問，說明世人對孟嘗君的看法見仁見智"}],"answer":["C"],"explanation":["(A)從食客的德行、能力判斷孟嘗君的優劣。(B)作者認為孟嘗君門下的食客，包含馮諼，都只是雞鳴狗盜之輩。(D)皆在質疑孟嘗君是否真正得士。"],"translation":["語譯： 世人都說孟嘗君能羅致賢士，因此賢士也都來歸附他，終於憑藉了他們的力量，使他從虎豹似的秦國脫險出來。唉！孟嘗君只是個雞鳴狗盜的頭目罷了，怎能說得上羅致賢士呢？不然的話，憑著齊國的富強，只要得到一個賢士，就應該可以南面稱王，制服秦國，哪裡還用得著雞鳴狗盜的力量呢？雞鳴狗盜的人物都出在他的門下，所以真正的賢士便不願來到了。"],"source":"課外閱讀文選 練習題","num":13,"section":"single","group":null,"graphic":null},"14":{"stem":"試就以下兩則資料，選出敘述正確的選項：","context":["甲、晉人、秦人圍鄭。","乙、晉侯、秦伯，貶稱人者。晉文以私忿勤民動眾，圍人之國；秦伯惟利為向背，從燭之武之言，不以義舉也。而二國結釁連兵，暴骨原野自此始矣。"],"options":[{"id":"A","text":"甲為《春秋》經文；乙偏重解釋經文的義例，類似《左傳》筆法"},{"id":"B","text":"「晉文以私憤勤民動眾」指「越國以鄙遠」、「朝濟而夕設版」"},{"id":"C","text":"「秦伯惟利為向背」指「既東封鄭，又欲肆其西封」"},{"id":"D","text":"晉、秦二國在圍鄭一事發生後，頻頻發生爭端，戰禍不斷"}],"answer":["D"],"explanation":["(A)由出處及乙的內容在解釋甲，可知甲是《春秋》經文。而由乙「晉侯、秦伯，貶稱人者」一句，可知是在解釋經文寫「晉人、鄭人」之因，近於《公羊傳》、《穀梁傳》「釋義例」的寫法，而非《左傳》「記史事」的寫法。(B)晉文起兵的原因是私怨，即「以其無禮於晉，且貳於楚也」。(C)秦伯追求的是利，即燭之武所言「舍鄭以為東道主，行李之往來，共其乏困」，以及不願「闕秦以利晉」。"],"translation":[],"source":"習作","num":14,"section":"single","group":null,"graphic":null},"15":{"stem":"選項中的詩句，最符合下文畫底線處所述表意方式的是：","context":["就中國古典詩學傳統而言，詩歌的意義往往以詩人個人內在的情感意念為重心，此等情意又是間接借助語言文字所呈示的對象加以烘襯，由是而形成一種獨特的審美意趣。至於間接烘襯的表現手法能成為主要的創作模式，就是根源於古典文化的論述中，對語言表意功能的質疑。一方面固然由於情感或意念本身不可捉摸的特性，另一方面也認定了語言作為一種表意的工具其實有所不足，甚或不完備，因而如何以有限的語言媒介傳寫極為流動精微的情感或意念，便成為一項備受關注的課題。（改寫自蔡英俊《語言與意義》）"],"options":[{"id":"A","text":"飄飄何所似？天地一沙鷗"},{"id":"B","text":"妾髮初覆額，折花門前劇"},{"id":"C","text":"持家但有四立壁，治病不蘄三折肱"},{"id":"D","text":"出師一表真名世，千載誰堪伯仲間"}],"answer":["A"],"explanation":["畫線處「此等情意又是間接借助語言文字所呈示的對象加以烘襯」所述表意方式即間接烘襯，指透過某種意象襯托出個人內在情感的手法。(A)透過廣大天地間一隻小小沙鷗的意象，襯托出自己漂泊不定的悲涼情緒。(B)、(C)單純敘事，未以意象襯托情感。(D)單純抒發己見，未以意象襯托情感。"],"translation":[],"source":"我讀至升級／指考108","num":15,"section":"single","group":null,"graphic":null},"16":{"stem":"依據文意，最符合文中觀點的敘述是：","context":[],"options":[{"id":"A","text":"不偏不執，成就性格的完整性，能因應變化而不偏離常道"},{"id":"B","text":"保持彈性，抱持英雄主義者能順時而為，與世界脈動同步"},{"id":"C","text":"退隱閒逸，能使人心境平淡，體驗人生百態進而陶鑄美德"},{"id":"D","text":"博採眾長，虛心接受不同意見，可有效處理各種緊急情況"}],"answer":["A"],"explanation":["(A)由「平淡的性格才能使對立的質素互不排斥，確保性格的完整多面向，使個人得以毫無阻礙地隨其所處的情境而應變」可知。(B)英雄主義：指崇拜單一個體，認為英雄才是人格最崇高的體現，或所有行為皆以個人為中心的意識形態。此與「不應當推展到強烈地獨占一個人的整個性格，而應當順著性格來發揮它」的平淡性格互相違背。(C)心境平淡，則不會特別選擇退隱或出仕，而是無論在什麼環境下都能安然面對人生百態，擁有一切美德又不陷溺其中。(D)由「使一個個體同時具備所有能力，並且隨時證明他所擁有的能力」可知，平淡的性格並非藉博採眾長，依靠他人協助來應對進退，而是保持虛待的狀態，以個人的彈性來回應世界的脈動。"],"translation":[],"source":"我讀至升級／指考107","num":16,"section":"single","group":"g16","graphic":null},"17":{"stem":"下列文句，最符合文中「平淡」境界的是：","context":[],"options":[{"id":"A","text":"鉛刀貴一割，夢想騁良圖。左眄澄江湘，右盼定羌胡"},{"id":"B","text":"新沐者必彈冠，新浴者必振衣，安能以身之察察，受物之汶汶者乎"},{"id":"C","text":"早歲那知世事艱，中原北望氣如山。樓船夜雪瓜洲渡，鐵馬秋風大散關"},{"id":"D","text":"當憂則憂，遇喜則喜，忽然憂樂兩忘，則隨所遇而皆適，未嘗有擇於其間"}],"answer":["D"],"explanation":["(A)表現願意施展才能、報效國家、消滅外患進而一統中原的壯志。屬於英雄主義式的投入，與文中「平淡」境界不符。(B)表現潔身自好，不願與環境同流合汙的態度。執著於個人「清白」的道德觀，與文中「平淡」境界不符。"],"translation":["語譯： 剛洗過頭的人一定會彈去帽上的灰塵，剛洗過澡的人一定會抖淨衣上的塵埃，怎能讓潔淨的身體，去接觸骯髒的東西呢。(C)表現年輕時意氣風發，胸懷收復故國失土的壯志豪情。同屬英雄主義式的投入，與文中「平淡」境界不符。語譯：年少時怎麼能明白世事的艱難，遠望被金人奪去的中原，氣勢恢弘如山。當年劉琦曾在大雪紛飛的夜裡，大敗金人樓船於瓜洲渡口，吳璘則騎乘戰馬挾著秋風，自金人手中收復了大散關。(D)表現隨遇而安，不懷憂也不生喜的心境，與文中「平淡」境界相符。語譯：碰上麻煩便煩惱憂愁，遭逢喜事便歡愉欣喜，若能捨去憂愁與快樂兩種情緒的執著，便能順應各種際遇，心思也就不須在憂愁與快樂間擺盪。"],"source":"我讀至升級／指考107","num":17,"section":"single","group":"g16","graphic":null},"18":{"stem":"甲文中「棉花糖實驗」過程中受試兒童的心路歷程，可與〈勞山道士〉中的王生上山求道之路相比較，請選出適當的分析：","context":[],"options":[{"id":"A","text":"王生求道的行為近似甲文中自我控力高的受試者"},{"id":"B","text":"堅定意志力的報酬，甲文是獲得雙倍棉花糖，王生則是獲得穿牆術"},{"id":"C","text":"要求他們忍耐的事，甲文是忍耐十五分鐘不吃棉花糖，王生則是被要求砍柴勞動"},{"id":"D","text":"試驗過程的忍耐，甲文的受試者與王生都處於想滿足欲望但又被迫忍耐的痛苦狀態"}],"answer":["C"],"explanation":["(A)由「能控制自己延宕滿足的小朋友，長大之後較有成就」可知，此處自我控制力較低的受試者是不能控制自己延宕滿足的，故無法堅持求道的王生比較近似甲文自我控制力低的受試者。(B)王生雖獲道士傳授穿牆術，但並非是他堅定求道後的報酬，而是他拜託道士至少傳授他一個小法術。(C)根據甲文「可以忍耐15分鐘不吃眼前的棉花糖，就可以得到雙倍的棉花糖」，可知要求受試者忍耐的事是忍耐15分鐘。王生接受的考驗則是早晚砍柴的勞動之苦。(D)甲文未提受試者的心理狀態，王生則有不堪其苦的心情，想離開卻又看到道士高超的法術，又忍耐留下，最後因「苦不可忍」，決定離開，心情複雜。"],"translation":[],"source":"課文相關延伸","num":18,"section":"single","group":"g18","graphic":null},"19":{"stem":"綜合甲、乙、丙三則資訊，以下人物與他所選擇的食物，配對較正確的是：","context":[],"options":[{"id":"A","text":"患有糖尿病的王先生想吃爌肉飯，再配上冰蜂蜜水，控制自己的血糖"},{"id":"B","text":"〈勞山道士〉中的王生在做出下山與否的決定前，宜先吃哈密瓜，提升意志力"},{"id":"C","text":"想靠降低熱量攝取減重的蘇蘇將早餐從原味優格加哈蜜瓜切片，改為燕麥粥"},{"id":"D","text":"正在健身，目標增肌的大明在訓練前後都吃了水煮雞肉和白米飯"}],"answer":["D"],"explanation":["(A)由丙文可知，糖尿病患者必須注意血糖平穩，調味也要清淡，爌肉飯味道濃郁，且含有高升糖的白米飯，還配上升糖指數88的蜂蜜水，會使他血糖驟升，對健康不利。(B)依據甲文，王生在做出需要意志力的決定前，如果可以提升血液中的葡萄糖，將可提高自我控制力，做出延宕滿足的決定。因此，他適合選吃高升糖的蜂蜜、胡蘿蔔，而非哈密瓜。(C)由丙文可知，想靠降低飲食攝取熱量減重必須減少每日攝取的總熱量、降低碳水化合物比例，因此蘇軾原本的選擇熱量低、碳水化合物比例也低，比高熱量的燕麥粥合適。(D)依據丙文，想要增肌必須在運動前後補充蛋白質與碳水化合物，他所選擇的水煮雞肉與白米飯符合要求。"],"translation":[],"source":"課文相關延伸","num":19,"section":"single","group":"g18","graphic":null},"20":{"stem":"依據上文，下列文句的主詞，前後相異的是：","context":[],"options":[{"id":"A","text":"遍求民間佳貓捕制之／輒被啖食"},{"id":"B","text":"抱投鼠屋／闔其扉"},{"id":"C","text":"見貓／怒奔之"},{"id":"D","text":"非怯也／待其惰也"}],"answer":["A"],"explanation":["(A)宮中之人／民間佳貓。(B)主詞皆為宮中之人。(C)主詞皆為大鼠。(D)主詞皆為獅貓。"],"translation":[],"source":"課外","num":20,"section":"single","group":"g20","graphic":null},"21":{"stem":"依據上文，關於獅貓除鼠的過程，敘述最適當的是：","context":[],"options":[{"id":"A","text":"「貓蹲良久」是因為看見老鼠身型龐大，所以嚇得不敢動彈"},{"id":"B","text":"「貓避登几上，鼠亦登，貓則躍下」目的是誘使大鼠消耗體力"},{"id":"C","text":"「口齕首領」是採取擒賊先擒王的策略，先制伏鼠群的領袖，讓鼠群望而生畏"},{"id":"D","text":"「貓聲嗚嗚，鼠聲啾啾」透過聽覺摹寫，呈現大鼠猖狂、獅貓屈居下風的情勢"}],"answer":["B"],"explanation":["(A)是耐心蹲伏，等待大鼠自行出洞，並非由於害怕。(C)「口齕首領」意指咬住大鼠的頭和脖子等要害，非指制服鼠群領袖。(D)呈現貓鼠纏鬥中，獅貓漸居上風，大鼠慘叫的情勢。"],"translation":[],"source":"課外","num":21,"section":"single","group":"g20","graphic":null},"22":{"stem":"根據上文，下列敘述最適當的是：","context":[],"options":[{"id":"A","text":"大鼠用以形容手無寸鐵的匹夫匹婦，只能任人宰割"},{"id":"B","text":"獅貓面對大鼠所採取的行動，符合《論語》：「臨事而懼，好謀而成者也」"},{"id":"C","text":"宮中之人由於捨近求遠的心態，故不由民間徵求佳貓，卻用外國獅貓來除害"},{"id":"D","text":"〈勞山道士〉於篇末針對故事內容加以評論，以揭示諷刺寓意，本文則無此做法"}],"answer":["B"],"explanation":["(A)由「匹夫按劍，何異鼠乎」可知大鼠形容的是有勇無謀、衝動行事之人。(B)「臨事而懼，好謀而成者也」指面臨事情時能戒慎恐懼，善用謀略而成功的人，符合本文中獅貓的行動。(C)因民間佳貓皆不敵大鼠，才用外國獅貓來除害，並非宮中之人捨近求遠。(D)篇末「然後知貓之避，……噫！匹夫按劍，何異鼠乎」即是藉由評論故事內容，揭露諷刺涵義。"],"translation":["語譯： 明朝萬曆年間，皇宮中有老鼠，長得跟貓一樣大，為害極為嚴重。從民間找遍了好貓捕捉老鼠，往往被老鼠吃掉了。恰好有外國進貢來的獅貓，渾身毛色雪白。把獅貓放進老鼠出沒的屋子，關上窗戶，偷偷觀看。貓蹲在地上很久，老鼠徘徊一陣後從洞中出來，見到貓之後跑來咬貓，貓躲老鼠跳到桌上，老鼠也跳上桌，貓又跳下來。這樣來來回回，不下百次。大家都認為貓膽小，認為這隻貓無能為力。不久之後，老鼠跑跳變慢了，肥大肚皮看上去有些喘，蹲在地上稍作休息。獅貓立即快速跳過來，爪子抓住老鼠頭頂，口咬住老鼠頭頸，持續對峙爭鬥，貓嗚嗚叫，老鼠啾啾呻吟。人們急忙打開窗戶觀看，老鼠腦袋已經被嚼碎了。這時，人們才明白獅貓開始時之所以躲老鼠，並不是膽怯，而是等待老鼠鬥志鬆懈下來。你來，我躲，你去，我又來，獅貓用的就是這計謀。啊！粗鄙的人一遇事就手按寶劍，一臉怒氣，與這老鼠有什麼不同呢？"],"source":"課外","num":22,"section":"single","group":"g20","graphic":null},"23":{"stem":"關於陸游〈書憤〉詩句的闡釋，說明最適當的是：","context":[],"options":[{"id":"A","text":"「早歲那知世事艱」是在暗示年少時期不知世事艱難，亦飽含北望中原受阻的憤懣"},{"id":"B","text":"「鐵馬秋風大散關」以過往具體的戰事感嘆抗金的艱難，是「空自許」的最佳注腳"},{"id":"C","text":"「鏡中衰鬢已先斑」藉由鏡中的白髮，肯定歲月的淬鍊，設想自己日後能出類拔萃"},{"id":"D","text":"「出師一表真名世」讚揚〈出師表〉的傳頌，以自明心跡，表明爭天下的豪情壯志"}],"answer":["A"],"explanation":["(B)回顧昔日的戰鬥場景，以呼應「氣如山」之志。而「空自許」則是壯心未遂的自我惆悵。(C)感嘆年歲已大。(D)藉此流露欲收復故土的情操，並非爭天下的雄心。"],"translation":["語譯： 年輕的時候，哪裡知道世事的艱難，北望中原失土，義憤填膺，豪氣如山。還記得當年下雪的寒夜，宋軍曾用高大的戰船作戰，在瓜洲的渡口打敗過金人的軍隊；秋風中，英雄騎著披上鐵甲的戰馬，在大散關擊退了敵人。我曾經期許自己，立志抗敵，捍衛邊疆，做邊界上的萬里長城，但是願望卻未能實現，現在對鏡自照，鬢髮已經花白。〈出師表〉真是舉世聞名，流芳百世；千年來，又有誰能夠和諸葛亮相匹敵。"],"source":"課外","num":23,"section":"single","group":"g23","graphic":null},"24":{"stem":"陸游〈書憤〉頷聯：「樓船夜雪瓜洲渡，鐵馬秋風大散關」，捨棄一切語法關係，全由名詞構成。下列詩句，與這種語法結構相異的是：","context":[],"options":[{"id":"A","text":"雞聲茅店月，人跡板橋霜"},{"id":"B","text":"大漠孤煙直，長河落日圓"},{"id":"C","text":"黃蘆岸白蘋渡口，綠楊堤紅蓼灘頭"},{"id":"D","text":"枯藤老樹昏鴉，小橋流水人家，古道西風瘦馬"}],"answer":["B"],"explanation":["(A)溫庭筠〈商山早行〉。"],"translation":["語譯： 荒村野店中旅客被雞鳴聲喚起趕路，天空殘月還亮著，木板橋上白霜未消，留下行人的足跡。(B)「直」、「圓」為形容詞。王維〈使至塞上〉。語譯：沙漠中一縷狼煙直立，長河上的落日渾圓。(C)白樸〈沉醉東風．漁父詞〉。語譯：岸邊長滿黃色的蘆葦、渡口飄著白色的蘋草花。灘頭岸邊，綠色的楊柳和紅色的蓼花交映著。(D)馬致遠〈天淨沙．秋思〉。語譯：枯藤纏繞的老樹上棲息著黃昏歸巢的烏鴉，小橋下流水潺潺，旁邊有幾戶人家，秋風吹過古老荒涼的道路，疲憊的瘦馬蹣跚前行。"],"source":"課外","num":24,"section":"single","group":"g23","graphic":null},"25":{"stem":"關於陸游〈書憤〉與下列黃庭堅〈寄黃幾復〉之比較，說明最適當的是：","context":["我居北海君南海，寄雁傳書謝不能。桃李春風一杯酒，江湖夜雨十年燈。","持家但有四立壁，治病不蘄三折肱。想得讀書頭已白，隔溪猿哭瘴煙藤。"],"options":[{"id":"A","text":"二詩均融合文史典故與傳說故事，展現宋詩善用事例之特點"},{"id":"B","text":"二詩均為平起式七言律詩，皆是追述往事，今昔對照以抒情"},{"id":"C","text":"二詩頷聯均由六組名詞構成，皆為習見詞彙，卻堆疊出鮮明意境"},{"id":"D","text":"〈書憤〉旨在抒發山河淪落與壯志未酬的悲憤，〈寄黃幾復〉蘊涵作者苦讀無成、孤獨淒涼之感"}],"answer":["C"],"explanation":["(A)二詩均善用文史典故：〈書憤〉一詩中，「樓船夜雪瓜洲渡，鐵馬秋風大散關」乃追述二十多年前宋高宗時的兩次抗金勝仗。「塞上長城」為南朝宋名將檀道濟被文帝冤枉下罪，死前怒斥「乃壞汝萬里長城」的自比典故。「〈出師〉一表」指諸葛亮在蜀漢建興五年出兵伐魏前所作的〈出師表〉；〈寄黃幾復〉中，「寄雁傳書謝不能」化用《漢書．蘇武傳》「雁足傳書」的說法，「持家但有四立壁」則用了司馬相如「家居徒四壁立」的典故，以及「治病不蘄三折肱」、「想得讀書頭已白」等詩句均化用古語，翻陳出新。然〈寄黃幾復〉有「雁足傳書」與「雁止衡陽」二傳說，〈書憤〉並沒有引用傳說。(B)近體詩的平、仄起式由首句第二字判讀，〈書憤〉為仄起式。(D)〈寄黃幾復〉表達對好友的懷念與關切，推崇黃幾復困窮而好學的精神，並無表現作者苦讀無成的淒涼之感。"],"translation":[],"source":"課文相關","num":25,"section":"single","group":"g23","graphic":null},"26":{"stem":"下列「」中的字義，前後相同的選項是：","context":[],"options":[{"id":"A","text":"鄰之厚，君之「薄」也／其門人甚眾，「薄」暮畢集"},{"id":"B","text":"眾視三人坐月中飲，鬚眉畢「見」／君不「見」高堂明鏡悲白髮"},{"id":"C","text":"寄雁傳書「謝」不能／使君「謝」羅敷：「寧可共載不？」"},{"id":"D","text":"「以」其無禮於晉／君子不「以」言舉人"},{"id":"E","text":"「微」夫人之力不及此／「微」斯人，吾誰與歸"}],"answer":["D","E"],"explanation":["(A)少、薄弱／迫近。(B)呈現、顯露／看見。(C)婉拒／詢問。(D)因為。(E)無、沒有。"],"translation":[],"source":"習作","num":26,"section":"multiple","group":null,"graphic":null},"27":{"stem":"根據本文，下列關於故事情節與人物言行的敘述，何者正確：","context":["奇門遁甲①之書，所在多有，然皆非真傳。真傳不過口訣數語，不著諸紙墨也。德州宋清遠先生言：曾訪一友，友留之宿，曰：「良夜月明，觀一戲劇可乎？」因取凳十餘，縱橫布院中，與清遠明燭飲堂上。二鼓後，見一人逾垣入，環轉階前，每遇一凳，輒蹣跚，努力良久乃跨過。始而順行，曲踊②一二百度；轉而逆行，又曲踊一二百度。疲極踣臥，天已向曙矣。友引至堂上，詰問何來。叩首曰：「吾實偷兒，入宅以後，惟見層層皆短垣，愈越愈不能盡；窘而退出，又愈越愈不能盡，故困頓見擒。死生惟命。」友笑遣之。謂清遠曰：「昨卜有此偷兒來，故戲以小術。」問：「此何術？」曰：「奇門法也。他人得之恐召禍，君真端謹，如願學，當授君。」清遠謝不願。友太息曰：「願學者不可傳，可傳者不願學，此術其終絕矣乎！」意若有失，悵悵送之返。（節錄自紀昀《閱微草堂筆記・如是我聞二》）","【注釋】①奇門遁甲：一種以古代天文律曆學為基礎，以推物及人事吉凶的術數。②曲踊：跳躍。"],"options":[{"id":"A","text":"友人事先卜知竊賊將至，因而擺設凳子，讓清遠在堂上觀看其受困的情形"},{"id":"B","text":"竊賊入院後反覆越牆，顯示院中確有層層短垣，只是夜色昏暗使他迷失方向"},{"id":"C","text":"竊賊進退皆無法脫身，直到天將亮時精疲力盡，才被友人帶到堂上盤問"},{"id":"D","text":"清遠謝絕友人傳授奇門之術，主要是擔心習得此術後，會替自己招來禍患"},{"id":"E","text":"友人感嘆願學者不可傳、可傳者不願學，流露出擇徒困難與術法恐將失傳的憂慮"}],"answer":["A","C","E"],"explanation":["(A)友人事先占卜得知竊賊將至，故意在院中布置十餘張凳子，邀請清遠觀看這場以奇門之術安排的「戲劇」。","(B)院中實際擺放的是凳子，竊賊卻將其看成層層短牆，因而反覆跨越、無法脫身。這是奇門之術造成的效果，並非院中確有短牆。","(C)竊賊不論順行或逆行，都無法走出庭院，最後疲憊倒地。直到天色將亮，友人才將他帶到堂上盤問。","(D)友人認為術法落入不適當的人手中恐怕招禍，因此願意傳授給品行端謹的清遠。但文章僅記載清遠婉拒，並未交代他不願學習的原因。","(E)友人感嘆有意學習的人不適合傳授，適合傳授的人卻不願學習，並憂慮術法終將失傳。文末「意若有失，悵悵送之返」進一步呈現其失落與惆悵。"],"translation":["語譯： 有關奇門遁甲這類書，到處都有，但都不是真傳。真傳不過是幾句口訣，是不寫在紙上的。德州人宋清遠先生說，他曾經尋訪一個朋友，朋友留他住宿，說：「美好的夜晚月光明亮，看一齣戲劇好嗎？」於是他搬來十幾個凳子，縱橫排放在院子裡，同宋清遠點著蠟燭在堂上飲酒。二更以後，看見一個人越過圍牆進來，在臺階前四面打轉，每碰到一個凳子，就搖晃跌撞，努力了好久，才跨過去。開始順著行走，跳躍一二百次；轉而倒著行走，又跳躍一二百次，疲勞極了倒臥在地，這時天已經快亮了。友人把他帶到堂前，詢問他是從哪裡來的。那人叩著頭說：「我其實是個小偷，進入宅子以後，只看見層層都是矮牆，愈跨越愈跨不完；窘迫不堪而想退出去，又愈跨越愈跨不完，所以疲乏困頓而被您擒獲。是死是活聽憑您發落。」友人笑著放走了他。友人對宋清遠說：「昨天占卜有這個小偷來，所以用小法術同他開個玩笑。」宋清遠問：「這是什麼法術？」友人回答說：「是奇門法。別人得到了這個法術恐怕會招來禍患，您正直而謹慎，如果您願意學，我可以傳授給您。」宋清遠辭謝不願學。友人嘆息說：「願意學的不可以傳授，可以傳授的不願意學，這套法術最終將斷絕了吧！」他的樣子好像若有所失，惆悵地送宋清遠回家了。"],"source":"課外","num":27,"section":"multiple","group":null,"graphic":null},"28":{"stem":"如果要和古代作家們分在同一個班，以下是他們的座位表，坐在不同位置的人會因為前、後、左、右（斜位不列入討論）的作家而有不同的話題，關於他們會談論到的話題，推測正確的是：","context":[],"options":[{"id":"A","text":"坐在②位置的人可能會常和周圍的人一起擔憂社會問題與國家未來"},{"id":"B","text":"坐在④位置的人向周圍的人請教考試策略，一定能金榜題名"},{"id":"C","text":"坐在⑤位置的人可能必須在討論駢、散創作文體時，調停周圍的人的爭執"},{"id":"D","text":"坐在⑥位置的人可以和周圍的所有人討論文言小說的架構和寫作手法"},{"id":"E","text":"③位置附近的人皆長期不受重用，創作了許多懷才不遇的詩文"}],"answer":["A","C"],"explanation":["(A)與②相鄰的范仲淹、杜甫皆是關心民生的人。范仲淹曾藉〈岳陽樓記〉一文表達先憂後樂的襟懷，杜甫為社會派詩人，詩作以反映社會現實及民生疾苦為主。(B)李白、杜甫、歸有光皆為科舉失利的文人，故向他們請教考試策略，可能會落榜。(C)與⑤相鄰的有韓愈、李商隱、歐陽脩。韓愈、歐陽脩為古文八大家之一，主張以樸實流暢的古文創作，李商隱則擅長駢文，注重典故及辭采駢儷。(D)王維為唐代詩人；柳宗元為唐宋古文八大家之一，擅長山水遊記與寓言。(E)③右邊的諸葛亮為蜀國丞相，受劉備、劉禪重用。"],"translation":[],"source":"課本","num":28,"section":"multiple","group":null,"graphic":"seat"},"29":{"stem":"下列各選項「　」內文字的詞性依序為「名詞、動詞」的是：","context":[],"options":[{"id":"A","text":"夫晉，何厭之有？既東「封」鄭，又欲肆其西「封」"},{"id":"B","text":"願陛下託臣以討賊興復之「效」，不「效」，則治臣之罪"},{"id":"C","text":"聖人無常「師」：孔子「師」郯子、萇弘、師襄、老聃"},{"id":"D","text":"人知從太守遊而樂，而不知太守之「樂」其「樂」也"},{"id":"E","text":"皆在朝日「始」出，夕舂未下，「始」極其濃媚"}],"answer":["B","C"],"explanation":["(A)動詞，以……為領土／名詞，領土。(B)名詞，功效／動詞，收效、成功。(C)名詞，老師／動詞，向……請教。(D)動詞，以……為樂／名詞，快樂。(E)皆為副詞，前者意為「開始、剛」，後者意為「才」。"],"translation":[],"source":"課本","num":29,"section":"multiple","group":null,"graphic":null},"30":{"stem":"關於「大詩人之祕妙」， 符合下文敘述的是：","context":["一切境界， 無不為詩人設。世無詩人， 即無此種境界。夫境界之呈於吾心而見於外物者， 皆須臾之物， 惟詩人能以此須臾之物， 鐫諸不朽之文字， 使讀者自得之。遂覺詩人之言， 字字為我心中所欲言， 而又非我之所能自言， 此大詩人之祕妙也。（ 王國維《人間詞話‧ 補遺 附錄十二》）"],"options":[{"id":"A","text":"能透過內心預知外在事物生發的時刻， 創作情景交融的境界"},{"id":"B","text":"能用高深幽微、華麗不朽的文字技巧， 紀錄生活片刻的事物"},{"id":"C","text":"能捕捉外界轉瞬即逝的景象， 並用難以磨滅的文字寫下感受"},{"id":"D","text":"能以過人的想像、奔放的文字寫出讀者內心所想所感的思緒"},{"id":"E","text":"能說出讀者內心有所觸動的情緒， 但讀者卻難以說清的話語"}],"answer":["C","E"],"explanation":["(A)境界是無法由創作產生，文中的境界是當下內在情感與外在事物相互呼應而來，故也無法透過預知來提前","知道外在事物生發的時刻，故非文中所提及的「詩人的祕妙」。(B)文中未提及所使用的文字技巧是否為高深幽微與華麗，僅以「不朽」二字傳達大詩人的文字具有永不磨滅的價值。(C)由文中可知，「夫境界之呈於吾心而見於外物者，皆須臾之物，惟詩人能以此須臾之物，鐫諸不朽之文字，使讀者自得之。」正是大詩人祕妙所在。(D)文中大詩人是以現實生活中，轉瞬即逝的景象化成文字，讓讀者將自身投射其中進而感同身受。並非是以過人的想像，也未提及其文字是奔放風格。(E)可從文中「遂覺詩人之言，字字爲我心中所欲言，而又非我之所能自言」可見得。"],"translation":["語譯： 所有的境界，全部都是為詩人而設的。如果世界上沒有詩人，也就沒有這種境界。能呈現於我們內心而又顯於外在事物的境界，都是轉瞬即逝的景象。只有詩人才能捕捉這一瞬間的景象，並且以深刻不朽的文字寫出來，使讀者也能有所相同的感受。由此覺得詩人的言語，字字句句都是我心中想說的，卻又是我難以能說清楚明白的話，這就是大詩人的奧妙所在。"],"source":"課外","num":30,"section":"multiple","group":null,"graphic":null}},"groups":{"g16":{"label":"第 16–17 題共用閱讀材料","paragraphs":["「淡」必須是我們性格中最主要的特徵，只有「淡」，才能使一個個體同時具備所有能力，並且隨時證明他所擁有的能力。因此，只有平淡的性格才能使對立的質素互不排斥，確保性格的完整多面向，使個人得以毫無阻礙地隨其所處的情境而應變。任何一種才性，都不應當推展到強烈地獨占一個人的整個性格，而應當順著性格來發揮它。最理想的情況，不是英雄主義式的投入，而是保持一種虛待的狀態。如此，他與世界的脈動是協調的，而且能毫無阻礙地接收這些脈動。","中國古代文人都有出仕的懷抱，因此他們只能在當官和辭官退隱之間抉擇。由於文化中重視平淡，他們的人格通常不會特別往哪一個方向突出，而是向所有的可能敞開。聖人既能夠投入政治生活，也能夠以最大的彈性，視當下的需要而退隱。聖人因其本性中的平淡，而能擁有一切的美德，但又不陷溺在任何一種美德裡。通過投入或遠離政治生活，他總是能隨時隨地準備好要面對各種緊急情況。這就是天道，雖然看起來經常變化，卻永遠不偏移。（改寫自余蓮《淡之頌》）"]},"g18":{"label":"第 18–19 題共用閱讀材料","paragraphs":["甲","1960年代，史丹佛大學的心理學家曾對一群四歲小孩做「棉花糖實驗」，和受試者說，如果可以忍耐15分鐘不吃眼前的棉花糖，就可以得到雙倍的棉花糖。心理學家追蹤多年後發現，能控制自己延宕滿足的小朋友，長大之後較有成就。最近科學家又發現，自我控制不生氣、不立刻領取獎賞，這個過程意外消耗能量，差不多與40公里長跑相等。而能量消耗之後必須補充，否則意志力會變得疲乏，讓我們的自我控制力下降。但要如何補充「意志力之源」呢？研究指出，只要在我們預期要「使用意志力」前補充一劑葡萄糖，就有助於提高自我控制，使人成功往目標邁進。","乙","__GLYCEMIC_TABLE__","丙","糖尿病建議飲食：均衡攝食，調味清淡，忌油炸食品。同時必須少吃富含精緻糖類食物，也不可多吃高澱粉含量食物，隨時注意血糖過高或過低。","健身建議飲食：平均分配三餐的蛋白質攝取量，並且在運動前後補充碳水化合物與蛋白質，讓肌肉中的胺基酸得到補充，不流失肌肉。","瘦身建議飲食：將每日攝取的總熱量減少，可將平常三餐中的碳水化合物份量調降為原本的三分之一，讓血糖不易高低起伏，胰島素穩定分泌，可降低脂肪儲存的速度。"],"table":"glycemic"},"g20":{"label":"第 20–22 題共用閱讀材料","paragraphs":["萬曆間，宮中有鼠，大與貓等，為害甚劇。遍求民間佳貓捕制之，輒被啖食。適異國來貢獅貓，毛白如雪。抱投鼠屋，闔其扉，潛窺之。貓蹲良久，鼠逡巡自穴中出，見貓，怒奔之。貓避登几上，鼠亦登，貓則躍下。如此反覆，不啻百次。眾咸謂貓怯，以為是無能為者。既而鼠跳擲漸遲，碩腹似喘。蹲地上少休。貓即疾下爪掬頂毛，口齕首領，輾轉爭持，貓聲嗚嗚，鼠聲啾啾。啟扉急視，則鼠首已嚼碎矣。然後知貓之避，非怯也，待其惰也。彼出則歸，彼歸則復，用此智耳。噫！匹夫按劍，何異鼠乎！（蒲松齡〈大鼠〉）"]},"g23":{"label":"第 23–25 題共用閱讀材料","paragraphs":["早歲那知世事艱，中原北望氣如山。樓船夜雪瓜洲渡，鐵馬秋風大散關。","塞上長城空自許，鏡中衰鬢已先斑。出師一表真名世，千載誰堪伯仲間！（陸游〈書憤〉）"]},"gm12":{"label":"混合題第 1–2 題共用閱讀材料","paragraphs":["甲","事實上許多──甚至是大部分──發明是好奇心的產物，發明家動手動腳、修葺補綴，做出巧奪天工的玩意，往往是福至心靈、妙手偶得，事前哪裡有什麼目標、藍圖。一旦發明了一件物事，發明家必須做的就是為它找個事做。只有在新發明「工作」了一段時間後，消費者才會覺得他們「需要」那件發明。還有一些新發明，在經過一段時間後發明的初衷被忘記了，因為消費者為它們找到了新的用途。……所以，發明往往才是需求之母，常識觀點顛覆了兩者的關係。","乙","所有的現代發明，只要有完整的文獻可考，都能發現同樣的發展模式。通常大家承認的發明家，都在前人既有的基礎上改進，而前人在同樣動機的驅使下，已經完成了設計、製作出原型、甚至生產出受歡迎的產品。……我們並不是要否定瓦特、愛迪生、萊特兄弟、摩斯以及惠特尼的成就，他們大幅改進了既有的發明，因此增加銷路，或因他們的改進，產品才有商業利益。                                  （甲、乙二文皆出自賈德‧戴蒙〈發明為需求之母〉）"]},"gm34":{"label":"混合題第 3–4 題共用閱讀材料","paragraphs":["「因果謬誤」是很常見的一種邏輯謬誤，其立論基礎是：當兩件事有關聯，且事件發生有先後時間差，那麼這兩件事情之間一定存在因果關係。但這樣的論述是會出現問題的，比如「你考試成績這麼差，一定是因為玩線上遊戲的關係」這句話，考試成績不佳和玩線上遊戲之間可能有關聯，但並不一定能形成因果關係。成績不佳可能有許多因素，包含因感冒狀態不好無法好好作答、試題超出範圍等。","另一種常見的邏輯謬誤，即是「滑坡謬誤」，即連續使用一連串的因果推論，並將每個事件之中的「可能關聯」擴大為「必然關聯」，最後得到一個極端且不合理的結論。例如「你如果不好好讀書就考不上好大學，畢業後就找不到好工作，這樣你的人生就會是失敗的」，就這段敘述來說，好大學、好工作、失敗的人生這之間其實沒有絕對的關聯，甚至「好」或「失敗」與否，都不該由他人定義。因此將所有事件以線性發展的方式歸納並強硬導出結論，就容易犯了滑坡謬誤而不自知。"]}},"vocab":[{"num":1,"stem":"賚","answer":"賞賜","section":"vocab"},{"num":2,"stem":"紿","answer":"欺騙","section":"vocab"},{"num":3,"stem":"以亂易整","answer":"以分裂取代團結","section":"vocab"},{"num":4,"stem":"「乃」爾寂飲","answer":"竟然","section":"vocab"},{"num":5,"stem":"驀然而「踣」","answer":"跌倒","section":"vocab"},{"num":6,"stem":"「唯」君圖之","answer":"表示希望語氣","section":"vocab"},{"num":7,"stem":"「行李」之往來","answer":"使者、外交人員","section":"vocab"},{"num":8,"stem":"吾「其」還也","answer":"還是","section":"vocab"},{"num":9,"stem":"「其」餞我於月宮可乎","answer":"可以、能夠","section":"vocab"}],"mixed":{"1":{"stem":"依據甲文觀點，下列哪一種情況最能作為「發明為需求之母」的例證？（2分）","context":[],"options":[{"id":"A","text":"都市常因暴雨積水，於是工程團隊研發透水鋪面，以改善排水的問題"},{"id":"B","text":"研究者意外得到新配方，隨後用來改善早已存在的登山裝備易濕問題"},{"id":"C","text":"研究者偶然製成低黏性膠料，後來使用者發現可製成反覆黏貼的便條"},{"id":"D","text":"手機常因電力不足斷電，科技公司研發高容量電池，以延長續航時間"}],"answer":["C"],"explanation":["甲文的邏輯是：先有發明 → 後來找到用途 → 進而形成需求。(C)的膠料起初無人知道用途，是使用者事後發現用途，符合此邏輯。(A)、(D)先有明確問題，再研發解決，是甲文所說的常識觀點。(B)雖然帶有「意外」色彩，但發明者事前已知道登山者的需求，並針對該需求量產，需求仍在發明之前，因此不符。"],"translation":[],"source":"","num":1,"section":"mixed","group":"gm12"},"2":{"stem":"甲、乙二文皆說明發明實際的發展過程。請依據文意，完成下表。①、② 各限 15 字以內。（各2分）","context":[],"options":[],"answer":[],"explanation":[],"translation":[],"source":"","tables":["process","model","rubric2"],"num":2,"section":"mixed","group":"gm12"},"3":{"stem":"依文中敘述，判斷在燭之武說服秦君的說辭中，可能存在「因果謬誤」的是：（2分）","context":[],"options":[{"id":"A","text":"越國以鄙遠，君知其難也，焉用亡鄭以陪鄰？鄰之厚，君之薄也"},{"id":"B","text":"若舍鄭以為東道主，行李之往來，共其乏困，君亦無所害"},{"id":"C","text":"君嘗為晉君賜矣，許君焦、瑕，朝濟而夕設版焉，君之所知也"},{"id":"D","text":"秦、晉圍鄭，鄭既知亡矣。若亡鄭而有益於君，敢以煩執事"}],"answer":["C"],"explanation":["(C)「因果謬誤」指因為「Y在X之後出現」而推論「X是產生Y的原因」。選項中燭之武以「歷史宿怨」挑起秦君的敏感神經，但晉惠公背信忘義之舉不代表晉文公也同樣會有此舉動，因此晉惠公的不義之舉不該成為秦國防備晉國的因素，由此可知此論述犯了「因果謬誤」。"],"translation":[],"source":"","num":3,"section":"mixed","group":"gm34"},"4":{"stem":"試就引文中所提及的兩種邏輯謬誤類型，判斷以下論述犯了哪一項謬誤，並須說明判斷的原因。","context":["動物實驗是對生命的不尊重，不尊重生命就是容忍暴力，這將是社會文明的末日。","(1)謬誤類型：(A)因果謬誤　(B)滑坡謬誤（2分）","(2)判斷原因：（2分）"],"options":[],"answer":["B"],"explanation":["此論述將「不尊重生命」、「容忍暴力」、「社會文明末日」之間的可能性擴大為必然性，而得出不合理的結論。"],"translation":[],"source":"","tables":["rubric4"],"num":4,"section":"mixed","group":"gm34"}},"doc":"臺北市立松山高級工農職業學校｜115學年度第1學期第1次定期評量"};</script>
<script>
'use strict';
const sectionInfo={single:{name:'單選題',min:1,max:25},multiple:{name:'多選題',min:26,max:30},vocab:{name:'字詞解釋',min:1,max:9},mixed:{name:'混合題',min:1,max:4}};
const state={section:'single',number:1};
const el=id=>document.getElementById(id);
function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function nl(t){return esc(t).replace(/\n/g,'<br>');}
const underlines={2:{stem:['沒有']},3:{options:['摩頂放踵','結草銜環','兔死狗烹','引領而望']},15:{context:['此等情意又是間接借助語言文字所呈示的對象加以烘襯']},24:{stem:['相異']}};
function focusNL(t,slot,num){let result=esc(t);if(state.section==='single'&&underlines[num]?.[slot])for(const phrase of underlines[num][slot])result=result.replaceAll(esc(phrase),'<u>'+esc(phrase)+'</u>');return result.replace(/\n/g,'<br>')}
function labelNum(num){return String(num).padStart(2,'0')}
function qOf(section,n){return section==='vocab'?DB.vocab[n-1]:section==='mixed'?DB.mixed[String(n)]:DB.questions[String(n)];}
function findSectionFor(n,sect){if(sect==='single'&&n>25&&n<=30)return 'multiple';if(sect==='multiple'&&n>=1&&n<=25)return 'single';return sect}
function getQuery(){const p=new URLSearchParams(location.search);let section=p.get('type')||'single',number=Number(p.get('q')||1);if(!sectionInfo[section])section='single';section=findSectionFor(number,section);if(!Number.isInteger(number)||number<sectionInfo[section].min||number>sectionInfo[section].max)number=sectionInfo[section].min;return {section,number}}
function setURL(){const u=new URL(location.href);u.searchParams.set('type',state.section);u.searchParams.set('q',state.number);try{history.replaceState({section:state.section,number:state.number},'',u.toString())}catch(e){/* 本機開啟 HTML 仍可查詢 */}}
function switchTo(section,number,scroll=false){state.section=section;const cfg=sectionInfo[section];state.number=Math.min(cfg.max,Math.max(cfg.min,number));setURL();render();if(scroll)el('questionPanel').scrollIntoView({block:'start',behavior:'smooth'});}
function rows(headers,rows){return '<div class="tablewrap"><table class="data-table"><thead><tr>'+headers.map(x=>'<th scope="col">'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function embeddedTable(id){if(id==='glycemic')return '<div class="fine-label" style="margin-top:15px">乙｜食物升糖指數與熱量表</div>'+rows(['食物名稱','升糖指數','熱量','食物名稱','升糖指數','熱量'],[['燕麥','55','380','紅葡萄','80','37'],['百頁豆腐','42','72','蜂蜜','88','297'],['白米飯','84','356','培根','49','405'],['雞肉','45','200','原味優格','25','62'],['豬肉','45','263','哈蜜瓜','4','42']])+'<p class="data-note">升糖指數：食物造成血中葡萄糖上升快慢的數值，愈高則愈快。</p>';
if(id==='process')return rows(['','一般人的常見想法','作者指出的實際發展歷程'],[['甲','先有需求，再產生發明','發明先出現 → （①） → 形成需求'],['乙','重要發明由知名發明家從無到有創造','前人已有設計、原型或產品 → 後來的發明家（②） → 產品增加銷路或具商業利益']]);
if(id==='model')return rows(['','參考答案','同義答案'],[['①','消費者逐漸為它找到用途','使用者後來發現新的用途'],['②','在前人基礎上加以改進','承接前人成果並改良']]);
if(id==='rubric2')return rows(['','2 分','1 分','0 分'],[['①','明確寫出「找到／發現用途」','僅寫「開始使用、逐漸普及」等結果，未指出用途的發現','與文意相反或無關'],['②','明確寫出「改進／改良既有成果」；若只填「加以改進」亦可','僅寫「繼續發展、進一步研究」等方向相關但不夠精確','寫成重新獨創、製作原型等與文意不符']]);
if(id==='rubric4')return rows(['評分原則','給分'],[['寫出參考答案的大意，文句完整通順','2'],['寫出部分參考答案，但未能完整說明原因（如僅寫出「推論不合理」）','1'],['未作答或離題','0']]);return ''}
function seatChart(){const seats=['①','黃庭堅','韓愈','⑤','歐陽脩','左思','③','諸葛亮','李商隱','王維','范仲淹','陶淵明','李白','蒲松齡','⑥','②','杜甫','④','歸有光','柳宗元'];return '<div class="seating-wrap"><div class="seating"><div class="lectern">講台</div><div class="seats">'+seats.map(n=>'<div class="seat '+(/^[①②③④⑤⑥]$/.test(n)?'blank':'')+'">'+n+'</div>').join('')+'</div></div></div>'}
function passageHTML(id){if(!id)return '';const obj=DB.groups[id];return '<section class="passage" aria-label="共用閱讀材料"><div class="passage-label">共用閱讀文本</div><details open><summary>'+esc(obj.label)+' <span class="subtle">（點選可收合）</span></summary><div class="passage-body">'+obj.paragraphs.map(p=>p==='__GLYCEMIC_TABLE__'?embeddedTable('glycemic'):'<p class="'+(/^[甲乙丙]$/.test(p)?'labelpara':'')+'">'+nl(p)+'</p>').join('')+'</div></details></section>'}
function qNav(){const cfg=sectionInfo[state.section];let names=[];for(let i=cfg.min;i<=cfg.max;i++)names.push('<button type="button" class="numbtn '+(state.number===i?'active':'')+'" data-n="'+i+'" aria-label="第 '+i+' 題" aria-current="'+(state.number===i?'true':'false')+'">'+i+'</button>');el('numberGrid').innerHTML=names.join('');el('navBadge').textContent=labelNum(cfg.min)+' — '+labelNum(cfg.max);for(const b of el('numberGrid').querySelectorAll('button'))b.addEventListener('click',()=>switchTo(state.section,+b.dataset.n,true));el('prevBtn').disabled=state.number<=cfg.min;el('nextBtn').disabled=state.number>=cfg.max;}
function qMain(q){if(state.section==='vocab')return '<div class="q-content"><div class="q-top"><div class="q-meta"><span class="q-id">字詞解釋 '+labelNum(q.num)+'</span><span class="chip">非選擇題・2 分</span></div></div><div class="fine-label">請解釋詞語</div><h2>'+esc(q.stem)+'</h2></div><div class="answer-section"><div class="section-head">參考答案</div><div class="answerline"><span class="answerpill">'+esc(q.answer)+'</span></div></div>';
const type=state.section==='single'?'單選題・2 分':state.section==='multiple'?'多選題・4 分':'混合題';const answer=q.answer&&q.answer.length?q.answer.map(esc).join('、'):'見下方參考答案';
let body='<div class="q-content"><div class="q-top"><div class="q-meta"><span class="q-id">'+(state.section==='mixed'?'混合題 ':'第 ')+labelNum(q.num)+(state.section==='mixed'?'':' 題')+'</span><span class="chip">'+type+'</span></div></div><div class="fine-label" style="margin-bottom:10px">題目</div><h2>'+focusNL(q.stem,'stem',q.num)+'</h2>';
if(q.context?.length)body+='<div class="context">'+q.context.map(p=>'<p>'+focusNL(p,'context',q.num)+'</p>').join('')+'</div>';
if(q.graphic==='seat')body+='<div class="context"><div class="fine-label">原卷座位表</div>'+seatChart()+'</div>';
if(q.tables?.includes('process'))body+=embeddedTable('process');
if(q.options?.length)body+='<ol class="options" aria-label="選項">'+q.options.map(o=>'<li class="option '+(q.answer?.includes(o.id)?'correct':'')+'"><span class="letter">'+esc(o.id)+'</span><span class="opttext">'+focusNL(o.text,'options',q.num)+'</span></li>').join('')+'</ol>';
body+='</div><div class="answer-section"><div class="section-head">正確答案 / 參考解答</div><div class="answerline"><span class="answerpill">'+answer+'</span>'+(q.source?'<span class="source">出處：'+esc(q.source)+'</span>':'')+'</div>';
if(q.explanation?.length)body+='<div class="detail-block"><h3>逐題詳解</h3><div class="explain">'+q.explanation.map(p=>'<p>'+nl(p)+'</p>').join('')+'</div></div>';
if(q.tables?.includes('model'))body+='<div class="detail-block"><h3>參考答案與同義答案</h3>'+embeddedTable('model')+'</div>';
if(q.tables?.includes('rubric2'))body+='<div class="detail-block"><h3>評分標準</h3>'+embeddedTable('rubric2')+'</div>';
if(q.tables?.includes('rubric4'))body+='<div class="detail-block"><h3>評分原則</h3>'+embeddedTable('rubric4')+'</div>';
if(q.translation?.length)body+='<details class="tr-more"><summary>閱讀語譯（點選展開）</summary><div class="explain">'+q.translation.map(p=>'<p>'+nl(p)+'</p>').join('')+'</div></details>';
body+='</div>';return body}
function render(){let cfg=sectionInfo[state.section],q=qOf(state.section,state.number);el('tabs').innerHTML=Object.entries(sectionInfo).map(([key,d])=>'<button type="button" class="tab '+(state.section===key?'active':'')+'" data-section="'+key+'" aria-pressed="'+(state.section===key)+'">'+d.name+'</button>').join('');el('tabs').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>switchTo(b.dataset.section,sectionInfo[b.dataset.section].min)));
el('numberInput').value=state.number;el('helper').textContent=(state.section==='single'?'單選題：第 1–25 題':state.section==='multiple'?'多選題：第 26–30 題':state.section==='vocab'?'字詞解釋：第 1–9 小題':'混合題：第 1–4 題（獨立編號）');el('helper').className='helper';el('reading').innerHTML=state.section==='vocab'?'':passageHTML(q.group);el('questionPanel').innerHTML=qMain(q);qNav();}
el('searchForm').addEventListener('submit',e=>{e.preventDefault();let raw=el('numberInput').value.trim(),n=Number(raw);let section=findSectionFor(n,state.section);let c=sectionInfo[section];if(!/^\d+$/.test(raw)||n<c.min||n>c.max){el('helper').textContent=state.section==='single'||state.section==='multiple'?'請輸入 1～30 的選擇題題號。':'請輸入 '+c.min+'～'+c.max+' 的題號。';el('helper').className='helper error';return;}switchTo(section,n,true)});
el('prevBtn').addEventListener('click',()=>switchTo(state.section,state.number-1,true));el('nextBtn').addEventListener('click',()=>switchTo(state.section,state.number+1,true));window.addEventListener('popstate',()=>{Object.assign(state,getQuery());render()});Object.assign(state,getQuery());render();
</script></body></html>
